spring:
  application:
    name: we-adk-builder
  servlet:
    multipart:
      # 원본 파일과 함께 전송되는 입력값 및 multipart 부가 용량을 고려한다.
      max-file-size: 20MB
      max-request-size: 25MB
  # ⚠ 2026-08-15 에 데이터 접근이 전부 MyBatis 로 넘어가면서 jpa 블록이 통째로 사라졌다.
  #    ddl-auto:validate 는 볼 @Entity 가 하나도 없어 이미 아무것도 안 재고 있었다 —
  #    그 그물은 BuilderApplicationTest 가 표 이름을 밖에서 박아 두고 메운다.
  flyway:
    enabled: true
    # ⚠ 이 셋을 application-local.yml 로 옮기지 마라. 그러면 zonky 테스트가 못 물려받아
    #    「테스트만 초록」이 된다. 여기 있어야 실물과 테스트가 같은 스키마에서 돈다.
    # ⛔ default-schema 는 이제 채번도 읽는다 — IdSequence 가 이 값을 시퀀스 이름에 붙인다.
    #    옮기면 채번이 public 을 보고 「그런 relation 이 없다」로 죽는다.
    #    빌더의 표는 builder 스키마에 산다. 같은 DB(we_adk)의 public 은 이웃 저장소
    #    we-adk-admin 몫이다 — 우리는 그걸 읽지 않는다.
    schemas: builder          # 없으면 만든다. flyway_schema_history 도 이 안에 둔다
    default-schema: builder   # 마이그레이션의 맨몸 CREATE TABLE 이 여기 떨어진다
  thymeleaf:
    cache: false
# 데이터 접근은 MyBatis 다 (2026-08-15 에 다 옮겼다). @Mapper 붙은 인터페이스는 부트가 알아서 찾고,
# SQL 은 아래 자리의 XML 에 있다. ⚠ XML 의 표 이름에는 `builder.` 를 손으로 붙인다 —
# MyBatis 는 위 jpa 의 default_schema 를 물려받지 않는다.
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
server:
  port: 8080
builder:
  # 제품 버전의 정본은 pom.xml 이며 Maven 리소스 처리 때 이 값으로 치환한다.
  application-version: "@project.version@"
  # GitLab 개발요청 이슈의 intake/progress/done 라벨을 1분마다 확인한다.
  # 테스트 프로필에서는 예약 실행을 열지 않고 동기화 본체를 직접 시험한다.
  dev-request-status:
    initial-delay-ms: 60000
    fixed-delay-ms: 60000
  # Flow 게시물 가져오기 — 키가 없으면 이 기능만 닫히고 서버는 뜬다.
  # 키는 application-local.yml 또는 BUILDER_FLOW_API_KEY 환경변수로 준다.
  flow:
    timeout: 20s
  # AI 실행기의 크기와 대기줄. ⛔ 코드에 숫자를 박지 않으려고 여기 둔다.
  # ⚠ 이 둘을 application-local.yml 로 옮기지 마라 — 그러면 테스트가 못 물려받는다(위 flyway 와 같은 이유).
  # ⛔ ai-concurrency 를 1 로 두지 마라: AI 실행은 「한 일」에 하나이지 서버 전체가 하나가 아니다.
  # ⚠ 실행기 스레드는 대부분 자식 프로세스를 기다리는 것이라 싸다 — 계정당 동시 실행(아래)이 3 이면
  #   한 사람의 FRD 완료(화면 N장)가 스레드 3~4개를 쓰므로, 다른 사람이 막히지 않게 8 로 둔다.
  ai-concurrency: 8
  ai-queue-capacity: 50
  # 한 계정이 동시에 돌릴 수 있는 claude 수 (2026-08-26). 종전에는 1(직렬)이었고 FRD 완료 때
  # 화면 N장의 정의서가 N배 걸렸다. 갱신 자격 덮어쓰기는 ClaudeCredentialRunner 가 DB 를 다시 읽어 막는다.
  # ⚠ 같은 계정이 같은 순간 OAuth 갱신을 두 번 하면 한쪽 실행이 실패할 수 있다 — 그게 잦으면 1 로 되돌린다.
  ai-account-concurrency: 3
  # 기획 레포 검사기 한 번의 상한. 전체 검사는 ~1초였다(263화면 실측) — 넉넉히 둔 것은
  # 첫 회에 `npm install` 이 같이 들어가기 때문이다. ⛔ 클론의 30분을 물려받지 않는다.
  check-timeout: 2m
  # 멀티모달 문서 읽기 — 스캔 PDF·그림처럼 서버가 글자를 못 뽑는 첨부만 여기로 간다.
  # ✅ 사내 문서 외부 전송은 2026-08-16 에 「분석해도 된다」로 정해졌다. 남은 것은 키뿐이다.
  # ⛔ api-key 가 비어 있으면 그 길이 통째로 닫힌다(서버는 그대로 뜬다). 그게 지금 상태다.
  # ⛔ 키를 여기 적지 마라. 앉힐 때는 application-local.yml 이나 환경변수
  #    BUILDER_DOCUMENTUNDERSTANDING_APIKEY 로 준다 — 이 파일은 저장소에 들어간다.
  document-understanding:
    # ⛔ 모델 이름에는 유통기한이 있다. 2.0 은 2026-06-01 에 닫혔고 2.5 는 새 키에 404 를 낸다 —
    #   처음 적었던 gemini-2.5-flash 는 적는 그날 이미 죽은 이름이었다(2026-08-16 확인).
    #   ⚠ 첨부가 「내용 분석 오류」로만 앉으면 여기부터 의심해라. 공급자의 deprecations 문서가 정본이다.
    # ⛔ 「가장 새 모델」을 고르지 마라 (2026-08-16 실측). 막 나온 3.7-flash 는 같은 문서로 두 번 다
    #   503(experiencing high demand)이었고 3.6-flash 는 두 번 다 200 이었다. 이 층이 하는 일은
    #   글자를 옮겨 적는 것이라 최신 지능이 필요 없다 — 붐비지 않는 쪽이 낫다.
    # ⚠ 그날그날 붐비는 모델이 다르다. 재기동 없이 바꾸려면 application-local.yml 에서 이 값만 덮어라.
    model: gemini-3.6-flash
    timeout: 3m
    # Base64 가 크기를 4/3 로 불린다 — 업로드 상한(20MB)을 그대로 쓰면 요청이 저쪽 상한을 넘는다.
    max-inline-bytes: 15728640
  # 요구사항 분석 — 사람이 「요구사항 분석」을 눌렀을 때만 돈다.
  requirement-analysis:
    # ✅ 2026-08-16 에 실측했다 — claude 에 --allowed-tools 와 --add-dir 둘 다 있다.
    # ⛔ 둘 다 값을 **여러 개** 받는 꼴이라 명령줄 맨 뒤에만 붙인다(CliClaudeRunner.command 참고).
    # ⛔ 쓰기 도구를 여기 더하지 마라: 요구사항 분석은 기획 저장소를 읽기만 해야 한다.
    #   빈 값으로 두면 플래그를 아예 안 붙이고 지시문의 금지만 남는다.
    allowed-tools: Read,Glob,Grep
    # 화면 짚기 첫 판은 기획 저장소를 코드베이스 색인으로 먼저 좁힌다.
    # 설치되지 않은 서버에서는 false로 내려 기존 Read/Grep 경로만 쓴다.
    codebase-memory-enabled: true
    codebase-memory-command: codebase-memory-mcp
    # 쓰라고 지목하는 모델. ⭐ 별칭만 적는다 — 날짜 붙은 정식 ID 를 박으면 모델이 새로 나오며 낡는다.
    # ⚠ 이걸 안 적으면 그 계정의 기본 모델로 도는데, 요금제마다 달라 **사람마다 다른 모델**이 된다.
    # FRD 인터뷰는 프론트·백엔드·권한·완료 기준과 간단 변경 경로까지 결정한다.
    # 2026-08-22 ~ 08-26 에는 opus + effort high 였다 — 실측(로컬 DB)에서 답변 한 턴이 57~438초.
    # 2026-08-27 병주 확정: 모델은 opus 로 두고 추론만 medium 으로 — 시간의 대부분은 생각 토큰(effort)이었고
    # 범위 판정 품질은 opus 에 남긴다. 더 빠르게 가려면 model: sonnet, 품질이 모자라면 effort: high.
    model: opus
    # 첫 판(저장소 탐색 + 첫 질문)과 이어붙이는 판(사용자 답변 뒤)의 추론 수준. 비우면 medium / 첫 판 값.
    effort: medium
    resume-effort: medium
