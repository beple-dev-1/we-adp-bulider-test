<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout(${title}, ${shape}, ${current}, ~{:: content})}">
<body>
<div th:fragment="content">
  <div class="list-loading-region" data-list-loading-region>
    <div class="page-loading-overlay list-loading-overlay" data-list-loading-overlay
         role="status" aria-label="조회 결과 처리 중" hidden>
      <span class="page-loading-indicator"><span class="page-loading-spinner" aria-hidden="true"></span></span>
    </div>

    <div class="page-head list-page-head">
      <div>
        <h1 class="page-head__title">SRT</h1>
        <p class="page-intro">직접 입력하거나 플로우에서 가져온 요청을 개발요청서로 처리합니다.</p>
      </div>
      <a class="button button--primary"
         th:href="@{/projects/{p}/artifacts/srts(p=${projectId},register='direct',query=${query},state=${stateFilter},owner=${ownerFilter},page=${page},pageSize=${pageSize})}">SRT 등록</a>
    </div>

    <form class="filter-bar filter-bar--srt filter-bar--with-action" th:if="${totalCount > 0}"
          method="get" role="search" data-list-loading-trigger
          th:action="@{/projects/{p}/artifacts/srts(p=${projectId})}">
      <div class="field">
        <label class="field__label" for="srt-owner">담당자</label>
        <select class="field__control" id="srt-owner" name="owner">
          <option value="">담당자 전체</option>
          <option th:each="option : ${ownerOptions}" th:value="${option}" th:text="${option}"
                  th:selected="${option == ownerFilter}"></option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="srt-state">상태</label>
        <select class="field__control" id="srt-state" name="state">
          <option value="">상태 전체</option>
          <option th:each="option : ${stateOptions}" th:value="${option}" th:text="${option}"
                  th:selected="${option == stateFilter}"></option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="srt-search">SRT 검색</label>
        <input class="field__control" id="srt-search" name="query" type="search"
               placeholder="SRT 번호, 요청 제목 또는 플로우 업무번호" th:value="${query}">
      </div>
      <button class="button" type="submit">검색</button>
    </form>

    <section class="state-panel list-empty-state" role="status" th:if="${matchedCount == 0}">
      <span class="list-empty-state__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M6.5 7.5h19v17h-19z"/><path d="M6.5 19.5h5l2.2 3h4.6l2.2-3h5"/><path d="M11 12h10M11 15.5h7"/></svg>
      </span>
      <strong>조회된 내용이 없습니다.</strong>
      <a class="button button--primary empty-state__action" th:if="${totalCount == 0}"
         th:href="@{/projects/{p}/artifacts/srts(p=${projectId},register='direct')}">SRT 등록</a>
    </section>

    <div class="table-wrap artifact-list-table-wrap table-wrap--tall" tabindex="0"
         aria-label="SRT 목록 표" th:if="${matchedCount > 0}">
      <table class="data-table data-table--dense srt-list-table">
        <thead><tr>
          <th scope="col">SRT</th><th scope="col">요청 내용</th><th scope="col">등록 방식</th>
          <th scope="col" th:if="${showFacets}">적용 대상</th>
          <th scope="col">상태</th><th scope="col">담당자</th><th scope="col">생성일시</th>
        </tr></thead>
        <tbody>
        <tr th:each="row : ${rows}">
          <td><a class="srt-row-link num"
                 th:href="@{/projects/{p}/artifacts/srts(p=${projectId},selected=${row.srt.id},query=${query},state=${stateFilter},owner=${ownerFilter},page=${page},pageSize=${pageSize})}"
                 th:text="${row.srt.label}">SRT-001</a></td>
          <td><a class="srt-row-link"
                 th:href="@{/projects/{p}/artifacts/srts(p=${projectId},selected=${row.srt.id},query=${query},state=${stateFilter},owner=${ownerFilter},page=${page},pageSize=${pageSize})}"
                 th:text="${row.srt.title}">요청 제목</a></td>
          <td class="nowrap" th:text="${row.srt.sourceLabel}">직접 입력</td>
          <td th:if="${showFacets}">
            <span class="facet-badges" th:unless="${#lists.isEmpty(row.facetNames)}">
              <span class="badge badge--outline" th:each="facet : ${row.facetNames}"
                    th:text="${facet}">제주</span>
            </span>
            <span th:if="${#lists.isEmpty(row.facetNames)}">—</span>
          </td>
          <td><span class="status-badge" th:classappend="${row.stateClass}"
                    th:text="${row.stateLabel}">개발요청서 생성 중</span></td>
          <td class="nowrap" th:text="${row.authorName}">이영희</td>
          <td class="num nowrap" th:text="${#temporals.format(row.srt.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-01 09:00</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="list-table-foot" th:if="${matchedCount > 0}">
      <span aria-hidden="true"></span>
      <nav class="list-pagination" aria-label="SRT 페이지 이동" data-list-loading-links>
        <span class="list-page-button" th:if="${page == 1}" aria-disabled="true" aria-label="이전 페이지">&lsaquo;</span>
        <a class="list-page-button" th:unless="${page == 1}" aria-label="이전 페이지"
           th:href="@{/projects/{p}/artifacts/srts(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},page=${page - 1},pageSize=${pageSize})}">&lsaquo;</a>
        <a class="list-page-button" th:each="number : ${pageNumbers}" th:text="${number}"
           th:classappend="${number == page} ? 'is-current' : ''"
           th:attr="aria-current=${number == page} ? 'page' : null"
           th:href="@{/projects/{p}/artifacts/srts(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},page=${number},pageSize=${pageSize})}"></a>
        <span class="list-page-button" th:if="${page == pageCount}" aria-disabled="true" aria-label="다음 페이지">&rsaquo;</span>
        <a class="list-page-button" th:unless="${page == pageCount}" aria-label="다음 페이지"
           th:href="@{/projects/{p}/artifacts/srts(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},page=${page + 1},pageSize=${pageSize})}">&rsaquo;</a>
      </nav>
      <form class="list-page-size" method="get" data-list-loading-trigger th:action="@{/projects/{p}/artifacts/srts(p=${projectId})}">
        <input type="hidden" name="query" th:value="${query}">
        <input type="hidden" name="state" th:value="${stateFilter}">
        <input type="hidden" name="owner" th:value="${ownerFilter}">
        <label class="sr-only" for="srt-page-size">목록 크기</label>
        <select class="field__control" id="srt-page-size" name="pageSize" data-list-loading-page-size>
          <option th:each="option : ${pageSizes}" th:value="${option}" th:text="${option} + '개씩'"
                  th:selected="${option == pageSize}"></option>
        </select>
      </form>
    </div>
  </div>

  <div th:replace="~{artifacts/srt :: register-layer}"></div>
  <th:block th:if="${detail != null}">
    <div th:replace="~{artifacts/srt :: detail-layer}"></div>
  </th:block>
  <script defer th:src="@{/js/srt.js}"></script>
</div>
</body>
</html>
