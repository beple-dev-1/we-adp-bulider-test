<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${frd.label() + ' ' + screen.screenName() + ' 변경 비교'}">FRD 화면 변경 비교</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/frd-canvas-compare.css">
</head>
<body class="fc-compare-window" th:classappend="${embedded} ? 'fc-compare-window--embedded'">
  <header class="fc-compare-head">
    <div class="fc-compare-head__identity">
      <span class="num" th:text="${frd.label()}">FRD-035</span>
      <h1>화면 변경 비교</h1>
      <p><strong th:text="${screen.screenName()}">가맹점 상세</strong><span class="num" th:text="${screen.screenId()}">screen-detail</span></p>
    </div>
    <nav class="fc-compare-nav" aria-label="작업 대상 화면 이동">
      <a th:if="${previousScreen != null}"
         th:href="@{/projects/{p}/artifacts/frds/{f}/canvas/compare(p=${projectId},f=${frd.id()},screenRowId=${previousScreen.id()},facet=${activeFacet},embedded=${embedded})}"
         th:title="${previousScreen.screenName()}">← 앞 화면</a>
      <span th:unless="${previousScreen != null}" aria-disabled="true">← 앞 화면</span>
      <a th:if="${nextScreen != null}"
         th:href="@{/projects/{p}/artifacts/frds/{f}/canvas/compare(p=${projectId},f=${frd.id()},screenRowId=${nextScreen.id()},facet=${activeFacet},embedded=${embedded})}"
         th:title="${nextScreen.screenName()}">다음 화면 →</a>
      <span th:unless="${nextScreen != null}" aria-disabled="true">다음 화면 →</span>
      <button type="button" aria-label="비교 화면 닫기"
              onclick="if(window.parent!==window){window.parent.postMessage({type:'frd-canvas-compare-close'},window.location.origin)}else{window.close()}">×</button>
    </nav>
  </header>

  <section class="fc-compare-summary" aria-labelledby="fc-compare-summary-title">
    <div>
      <h2 id="fc-compare-summary-title" th:text="${changeSummaryLabel}">반영된 변경</h2>
      <span th:text="${#lists.size(comparisonChanges) + '건'}">2건</span>
    </div>
    <ul th:if="${!#lists.isEmpty(comparisonChanges)}">
      <li th:each="change : ${comparisonChanges}" th:text="${change}">폐업 상태 표시를 추가했습니다.</li>
    </ul>
    <p th:if="${#lists.isEmpty(comparisonChanges)}">아직 기록된 변경 내용이 없습니다.</p>
    <div class="fc-compare-highlight-legend" aria-label="화면 변경 위치 강조 범례"
         th:if="${baselinePreviewPath != null and draftAvailable}">
      <span><i class="is-changed" aria-hidden="true"></i>변경</span>
      <span><i class="is-added" aria-hidden="true"></i>추가</span>
      <span><i class="is-removed" aria-hidden="true"></i>삭제</span>
    </div>
  </section>

  <main class="fc-compare-grid">
    <section class="fc-compare-pane" aria-labelledby="fc-baseline-title">
      <header>
        <div><span>기준</span><h2 id="fc-baseline-title">기준 화면</h2></div>
        <p>기획 저장소의 기준 솔루션 목업</p>
      </header>
      <div class="fc-compare-preview" th:if="${baselinePreviewPath != null}">
        <iframe title="기획 저장소 기준 화면"
                th:src="@{/projects/{p}/artifacts/solution-mockups/files/{path}(p=${projectId},path=${baselinePreviewPath})} + ${previewSkinQuery}"></iframe>
      </div>
      <div class="fc-compare-empty" th:unless="${baselinePreviewPath != null}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"></path></svg>
        <strong th:text="${screen.isNewScreen() ? '신규 화면이라 기준 화면이 없습니다' : '기준 화면 미리보기가 없습니다'}">기준 화면이 없습니다</strong>
        <p th:text="${screen.isNewScreen() ? '오른쪽 FRD 수정안을 기준으로 신규 화면 구성을 검토해 주세요.' : '솔루션 목업에서 기준 화면을 확인하지 못했습니다.'}">기준 화면을 확인하지 못했습니다.</p>
      </div>
    </section>

    <section class="fc-compare-pane fc-compare-pane--draft" aria-labelledby="fc-draft-title">
      <header>
        <div><span>수정안</span><h2 id="fc-draft-title">FRD 수정안</h2></div>
        <p>현재 FRD 작업공간에 저장된 화면</p>
      </header>
      <div class="fc-compare-preview" th:if="${draftAvailable}">
        <iframe title="현재 FRD 수정안"
                th:src="@{/projects/{p}/artifacts/frds/{f}/screens/{s}/preview(p=${projectId},f=${frd.id()},s=${screen.id()},facet=${activeFacet})}"></iframe>
      </div>
      <div class="fc-compare-empty" th:unless="${draftAvailable}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.3 3.7L17 8l-3.7 1.3L12 13l-1.3-3.7L7 8l3.7-1.3L12 3ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8L5 14Z"></path></svg>
        <strong>FRD 수정안이 아직 없습니다</strong>
        <p>AI 초안을 만들거나 상세 화면에서 수정한 뒤 다시 비교해 주세요.</p>
      </div>
    </section>
  </main>
  <script defer src="/js/frd-canvas-compare.js"></script>
</body>
</html>
