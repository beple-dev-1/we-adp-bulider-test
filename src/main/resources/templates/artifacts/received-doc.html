<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout(${title}, ${shape}, ${current}, ~{:: content})}">
<body>
<div th:fragment="content">

  <!--/*
    목업 docs/mockups/01b-received-document-edit.html 이 정본이다.
    ⛔ 좌우 대조를 **기본**으로 되돌리지 마라 (2026-08-15). 대조할 것이 있는 것은 멀티모달이
       읽어 낸 문서뿐이고, 그때만 확인 모드가 열린다. 그 밖에는 문서 내용 한 칸이다.
    ⛔ 「AI 1차 정리」·「AI 정리본」·「등록 원문」·「처리 방향 선택」을 되살리지 마라 — 개념째 폐기다.
  */-->

  <div class="page-head document-page-head document-compare-head">
    <div>
      <h1 class="page-head__title" th:text="${intake.title()}"></h1>
    </div>
    <div class="document-compare-head__actions">
      <a class="button" th:href="@{/projects/{p}/artifacts/received-docs(p=${projectId})}">목록으로</a>

      <form th:if="${canAnalyze}" method="post"
            th:action="@{/projects/{p}/artifacts/received-docs/{i}/analyze-requirements(p=${projectId},i=${intake.id()})}">
        <button class="button button--primary" type="submit"
                th:text="${analysisTried} ? '요구사항 다시 분석' : '요구사항 분석'"></button>
      </form>
      <form th:if="${canRetry}" method="post"
            th:action="@{/projects/{p}/artifacts/received-docs/{i}/reprocess(p=${projectId},i=${intake.id()})}">
        <button class="button" type="submit">내용 분석 다시 시도</button>
      </form>
      <form th:if="${canDelete}" method="post"
            th:action="@{/projects/{p}/artifacts/received-docs/{i}/delete(p=${projectId},i=${intake.id()})}"
            onsubmit="return confirm('이 문서를 삭제할까요? 삭제한 문서는 되돌릴 수 없습니다.');">
        <button class="button button--danger-outline" type="submit">문서 삭제</button>
      </form>
    </div>
  </div>

  <dl class="document-compare-meta" aria-label="문서 정보">
    <div>
      <dt>문서 상태</dt>
      <dd th:text="${document.contentState().label()}"></dd>
    </div>
    <div>
      <dt>문서 종류</dt>
      <dd th:text="${document.documentType().label()}"></dd>
    </div>
    <div>
      <dt>적용 구분</dt>
      <dd>
        <span class="facet-badges" th:unless="${#lists.isEmpty(facets)}">
          <span class="badge badge--outline" th:each="facet : ${facets}" th:text="${facet}"></span>
        </span>
        <span th:if="${#lists.isEmpty(facets)}" class="cell__sub">없음</span>
      </dd>
    </div>
    <div>
      <dt>회의 일시</dt>
      <dd class="num" th:if="${document.meetingAt() != null}"
          th:text="${#temporals.format(document.meetingAt(), 'yyyy-MM-dd HH:mm')}"></dd>
      <dd class="cell__sub" th:if="${document.meetingAt() == null}">없음</dd>
    </div>
    <div>
      <dt>참석자</dt>
      <dd th:text="${document.attendees() != null} ? ${document.attendees()} : '없음'"></dd>
    </div>
    <div>
      <dt>등록 파일</dt>
      <dd th:if="${document.hasFile()}">
        <a th:href="@{/projects/{p}/artifacts/received-docs/{i}/file(p=${projectId},i=${intake.id()})}"
           target="_blank" th:text="${document.originalName()} + ' · ' + ${sizeText}"></a>
      </dd>
      <dd class="cell__sub" th:unless="${document.hasFile()}"
          th:text="${document.documentType().name() == 'FLOW'} ? 'Flow 게시물' : '직접 입력'"></dd>
    </div>
  </dl>

  <!--/* 되튕겨 온 거절 사유. ⚠ 개발자 원문이 아니라 사람에게 하는 말만 온다 */-->
  <p class="source-error" th:if="${error}" th:text="${error}"></p>

  <!--/*
    ⛔ 못 읽는 문서도 올라가고 보존된다 — 막는 것은 다음 걸음뿐이다.
    빈 상태가 아니라 다음에 할 것을 준다.
  */-->
  <p class="source-error" th:if="${document.contentState().name() == 'FAILED'}">
    <span th:text="${document.readCheckReason()} ?: '이 문서의 내용을 읽지 못했습니다'"></span>.
    <br>글로 옮겨 붙이거나 변환한 파일을 올리면 그때 요구사항 분석이 열립니다.
  </p>

  <section th:if="${contentProcessing}" class="document-processing-bar" role="status"
           aria-live="polite" aria-labelledby="document-processing-title">
    <div class="document-processing-bar__label">
      <h2 id="document-processing-title">문서 내용 분석 중</h2>
      <span>완료되면 문서 내용이 표시됩니다.</span>
    </div>
    <span class="document-processing-bar__track" aria-hidden="true"><span></span></span>
  </section>

  <!--/* ─── 기본 상세 — 한 칸짜리 문서 내용 ─── */-->
  <div th:unless="${contentProcessing}" class="document-compare-workspace document-compare-workspace--single">
    <section th:unless="${contentProcessing}" class="document-compare-pane" aria-labelledby="document-content-title">
      <header class="document-compare-pane__head">
        <div>
          <h2 id="document-content-title">문서 내용</h2>
        </div>
        <span class="edit-hint" th:text="${document.hasFile()} ? '첨부파일에서 확인한 내용'
                       : (${document.documentType().name() == 'FLOW'} ? 'Flow 게시물 원문' : '등록한 원문')"></span>
      </header>
      <div class="document-source-copy document-content-body"
           th:if="${document.documentContent() != null}"
           th:text="${document.documentContent()}"></div>
      <div class="document-source-copy cell__sub" th:if="${document.documentContent() == null}"
           th:text="${document.contentState().label()} + ' — 아직 확인된 내용이 없습니다.'"></div>
      <footer class="document-compare-pane__foot">
        <span>등록한 원문은 그대로 보존됩니다.</span>
      </footer>
    </section>
  </div>

  <section th:unless="${contentProcessing}" class="requirement-summary" aria-labelledby="requirement-summary-title">
    <h2 id="requirement-summary-title">생성된 요구사항
      <span class="num" th:text="${requirementCount} + '건'"></span></h2>
    <div class="requirement-summary__guide" th:if="${hasGeneratedRequirements}">
      <!--/*
        ⛔ 「확정·직접 고친 것도 함께 사라진다」를 지우지 마라 (2026-08-17). 이 삭제는 제외가 아니라
           **줄을 지우는 것**이라, 사람이 확정해 두거나 손으로 고쳐 놓은 본문까지 통째로 간다.
           지금은 확정된 요구사항도 막지 않는다 — 확정을 되돌리는 길이 없어서 막으면 재분석이 영영 닫힌다.
      */-->
      <p>다시 분석하려면 기존 요구사항을 삭제해야 합니다.
        확정하거나 직접 고친 내용도 함께 사라지며 되돌릴 수 없습니다.</p>
      <div class="requirement-summary__actions">
        <a class="button button--small"
           th:href="@{/projects/{p}/artifacts/requirements(p=${projectId},sourceIntakeId=${intake.id()})}">요구사항 확인</a>
        <form th:if="${canDeleteRequirements}" method="post"
              th:action="@{/projects/{p}/artifacts/received-docs/{i}/delete-requirements(p=${projectId},i=${intake.id()})}"
              onsubmit="return confirm('생성된 요구사항을 모두 삭제할까요? 확정하거나 직접 고친 내용도 함께 사라지고, 요구사항과 번호는 되돌릴 수 없습니다.');">
          <button class="button button--small button--danger-outline" type="submit">생성된 요구사항 삭제</button>
        </form>
      </div>
    </div>
  </section>

</div>
</body>
</html>
