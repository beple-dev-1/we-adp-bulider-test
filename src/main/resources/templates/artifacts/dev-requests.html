<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout(${title}, ${shape}, ${current}, ~{:: content})}">
<body>
<div th:fragment="content">
  <div class="list-loading-region" data-list-loading-region>
    <div class="page-loading-overlay list-loading-overlay" data-list-loading-overlay
         role="status" aria-label="조회 결과 처리 중" hidden>
      <span class="page-loading-indicator">
        <span class="page-loading-spinner" aria-hidden="true"></span>
      </span>
    </div>

  <div class="page-head list-page-head">
    <div>
      <h1 class="page-head__title">개발요청서</h1>
      <p class="page-intro">완료한 FRD를 기준으로 개발 조직에 전달할 내용을 확인합니다.</p>
    </div>
  </div>

  <!--/*
    목업 docs/mockups/06-dev-requests.html 이 정본이다.
    ⛔ 「적용 대상」 열은 적용 대상을 쓰는 프로젝트에서만 그린다(showFacets) — 언제나 비는 열은 거짓말이다.
    ⛔ 「다음 작업」 열을 만들지 마라 — 전송 상태가 곧 다음 행동이다(목업 검사기가 막는다).
    검색 영역은 FRD 작업 목록과 같은 순서를 쓴다. 상태는 전송 상태만 거른다.
  */-->

  <form class="filter-bar filter-bar--five filter-bar--with-action" th:if="${totalCount > 0}"
        method="get" role="search" data-list-loading-trigger
        th:action="@{/projects/{p}/artifacts/dev-requests(p=${projectId})}">
    <div class="field">
      <label class="field__label" for="dev-request-system">시스템</label>
      <select class="field__control" id="dev-request-system" name="system">
        <option value="">시스템 전체</option>
        <option th:each="item : ${systemOptions}" th:value="${item.value}" th:text="${item.label}"
                th:selected="${item.value == systemFilter}"></option>
      </select>
    </div>
    <div class="field">
      <label class="field__label" for="dev-request-owner">담당자</label>
      <select class="field__control" id="dev-request-owner" name="owner">
        <option value="">담당자 전체</option>
        <option th:each="item : ${ownerOptions}" th:value="${item.value}" th:text="${item.label}"
                th:selected="${item.value == ownerFilter}"></option>
      </select>
    </div>
    <div class="field">
      <label class="field__label" for="dev-request-state">전송 상태</label>
      <select class="field__control" id="dev-request-state" name="state">
        <option value="">전송 상태 전체</option>
        <option th:each="item : ${stateOptions}" th:value="${item.value}" th:text="${item.label}"
                th:selected="${item.value == stateFilter}"></option>
      </select>
    </div>
    <div class="field">
      <label class="field__label" for="dev-request-search">개발요청서 검색</label>
      <input class="field__control" id="dev-request-search" name="query" type="search"
             placeholder="개발요청서 번호, 업무명 또는 FRD 번호를 입력하세요" th:value="${query}">
    </div>
    <button class="button" type="submit">검색</button>
  </form>

  <section class="state-panel list-empty-state" role="status" th:if="${matchedCount == 0}">
    <span class="list-empty-state__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M6.5 7.5h19v17h-19z"/><path d="M6.5 19.5h5l2.2 3h4.6l2.2-3h5"/><path d="M11 12h10M11 15.5h7"/></svg>
    </span>
    <strong>조회된 내용이 없습니다.</strong>
  </section>

  <div class="table-wrap artifact-list-table-wrap table-wrap--tall" th:if="${matchedCount > 0}">
    <table class="data-table data-table--dense dev-request-table">
      <thead><tr>
        <th scope="col">개발요청서</th><th scope="col">업무</th><th scope="col">시스템</th>
        <th scope="col" th:if="${showFacets}">적용 대상</th>
        <th scope="col">작업 범위</th><th scope="col">전송 상태</th><th scope="col">개발 상태</th>
        <th scope="col">담당자</th><th scope="col">원본 작업</th>
        <th scope="col">생성일시</th><th scope="col">요청일시</th>
      </tr></thead>
      <tbody>
      <tr th:each="row : ${rows}"
          th:classappend="${row.request().canMergeDevelopment()} ? 'dev-request-row--merge-required' : ''">
        <td><a class="artifact-list-link num"
               th:href="@{/projects/{p}/artifacts/dev-requests/{r}(p=${projectId},r=${row.request().id()},query=${query},state=${stateFilter},owner=${ownerFilter},system=${systemFilter},page=${page},pageSize=${pageSize})}"
               th:text="${row.request().label()}">DR-001</a></td>
        <td th:text="${row.request().title()}">업무명</td>
        <td>
          <span class="facet-badges"
                th:if="${row.request().systemCode() != null && !row.request().systemCode().isBlank()}">
            <span class="badge badge--outline"
                  th:text="${systemLabels.label(row.request().systemCode())}">웹뷰</span>
          </span>
          <span th:if="${row.request().systemCode() == null || row.request().systemCode().isBlank()}">—</span>
        </td>
        <td th:if="${showFacets}">
          <span class="facet-badges" th:unless="${#lists.isEmpty(row.request().facetList())}">
            <span class="badge badge--outline" th:each="facet : ${row.request().facetList()}"
                  th:text="${facet}">익산</span>
          </span>
          <span th:if="${#lists.isEmpty(row.request().facetList())}">—</span>
        </td>
        <td class="nowrap" th:text="${row.rangeLabel()}">화면 2개 · 신규 1개 · 수정 1개 · 백엔드 1건</td>
        <td><span class="status-badge" th:classappend="${row.stateClass()}"
                  th:text="${row.stateLabel()}">대기</span></td>
        <td><span class="status-badge" th:classappend="${row.request().developmentStateClass()}"
                  th:text="${row.request().developmentStateLabel()}">대기</span></td>
        <td class="nowrap" th:text="${row.ownerLabel()}">이영희</td>
        <td>
          <a class="artifact-list-link num" th:if="${!row.srtSource()}"
             th:href="@{/projects/{p}/artifacts/frds/{f}(p=${projectId},f=${row.request().frdId()})}"
             th:text="${row.sourceLabel()}">FRD-001</a>
          <a class="artifact-list-link num" th:if="${row.srtSource()}"
             th:href="@{/projects/{p}/artifacts/srts(p=${projectId},selected=${row.source().id()})}"
             th:text="${row.sourceLabel()}">SRT-001</a>
        </td>
        <td class="num nowrap"
            th:text="${#temporals.format(row.request().createdAt(), 'MM-dd HH:mm')}">08-21 13:00</td>
        <td class="num nowrap"
            th:text="${row.requestedAt() == null ? '—' : #temporals.format(row.requestedAt(), 'MM-dd HH:mm')}">—</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="list-table-foot" th:if="${matchedCount > 0}">
    <span aria-hidden="true"></span>
    <nav class="list-pagination" aria-label="개발요청서 페이지 이동" data-list-loading-links>
      <span th:if="${page == 1}" class="list-page-button" aria-disabled="true" aria-label="이전 페이지">&lsaquo;</span>
      <a th:unless="${page == 1}" class="list-page-button" aria-label="이전 페이지" th:text="'‹'"
         th:href="@{/projects/{p}/artifacts/dev-requests(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},system=${systemFilter},pageSize=${pageSize},page=${page - 1})}"></a>
      <a th:each="number : ${pageNumbers}" class="list-page-button"
         th:classappend="${number == page} ? 'is-current' : ''"
         th:attr="aria-current=${number == page} ? 'page' : null"
         th:text="${number}"
         th:href="@{/projects/{p}/artifacts/dev-requests(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},system=${systemFilter},pageSize=${pageSize},page=${number})}"></a>
      <span th:if="${page == pageCount}" class="list-page-button" aria-disabled="true" aria-label="다음 페이지">&rsaquo;</span>
      <a th:unless="${page == pageCount}" class="list-page-button" aria-label="다음 페이지" th:text="'›'"
         th:href="@{/projects/{p}/artifacts/dev-requests(p=${projectId},query=${query},state=${stateFilter},owner=${ownerFilter},system=${systemFilter},pageSize=${pageSize},page=${page + 1})}"></a>
    </nav>
    <form class="list-page-size" method="get" data-list-loading-trigger
          th:action="@{/projects/{p}/artifacts/dev-requests(p=${projectId})}">
      <input type="hidden" name="query" th:value="${query}">
      <input type="hidden" name="state" th:value="${stateFilter}">
      <input type="hidden" name="owner" th:value="${ownerFilter}">
      <input type="hidden" name="system" th:value="${systemFilter}">
      <label class="sr-only" for="dev-requests-page-size">목록 크기</label>
      <select class="field__control" id="dev-requests-page-size" name="pageSize" data-list-loading-page-size>
        <option th:each="option : ${pageSizes}" th:value="${option}" th:text="${option} + '개씩'"
                th:selected="${option == pageSize}"></option>
      </select>
    </form>
  </div>
  </div>
</div>
</body>
</html>
