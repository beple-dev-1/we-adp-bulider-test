<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="frd-delete-dialog-host" th:fragment="dialog">
  <dialog class="dialog" id="frd-delete-dialog" aria-modal="true"
          aria-labelledby="frd-delete-title" aria-describedby="frd-delete-description">
    <form method="post"
          th:action="@{/projects/{p}/artifacts/frds/{f}/delete(p=${projectId},f=${frd.id()},query=${listQuery},state=${listState},owner=${listOwner},system=${listSystem},page=${listPage},pageSize=${listPageSize})}">
      <header class="dialog__header">
        <div class="dialog__header-copy">
          <span class="dialog__kicker num" th:text="${frd.label()}">FRD-043</span>
          <h2 class="dialog__title" id="frd-delete-title">FRD 작업 삭제</h2>
          <p class="dialog__description" id="frd-delete-description">이 작업의 모든 내용을 삭제합니다.</p>
        </div>
        <button class="dialog__close" type="button" data-frd-delete-close aria-label="FRD 작업 삭제 취소"></button>
      </header>
      <div class="dialog__body">
        <p class="dialog__notice"><strong th:text="${frd.label()} + ' 작업을 삭제하시겠습니까?'">FRD-043 작업을 삭제하시겠습니까?</strong></p>
        <p>인터뷰 내용, 분석 결과, 화면 초안과 작업공간이 모두 삭제되며 복구할 수 없습니다.</p>
      </div>
      <div class="dialog__actions">
        <button class="button" type="button" data-frd-delete-close>취소</button>
        <button class="button button--danger-outline" type="submit"
                data-submit-loading="FRD 작업 삭제 중" data-submit-loading-tone="dark">FRD 작업 삭제</button>
      </div>
    </form>
  </dialog>
  <script>
    (() => {
      const dialog = document.getElementById('frd-delete-dialog');
      document.querySelectorAll('[data-frd-delete-open]').forEach(button =>
        button.addEventListener('click', () => {
          button.closest('details')?.removeAttribute('open');
          dialog?.showModal();
        }));
      dialog?.querySelectorAll('[data-frd-delete-close]').forEach(button =>
        button.addEventListener('click', () => dialog.close()));
    })();
  </script>
</div>
</body>
</html>
