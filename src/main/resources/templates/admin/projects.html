<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout('프로젝트 관리', '관리', 'projects', ~{:: content})}">
<body>
<div th:fragment="content">

  <div class="page-head list-page-head">
    <div>
      <h1 class="page-head__title">프로젝트 관리</h1>
      <p class="page-intro">Builder에서 사용할 기획 저장소와 연결 상태를 관리합니다.</p>
    </div>
    <a class="button button--primary" th:href="@{/admin/projects/new}">프로젝트 등록</a>
  </div>

  <div class="state-panel state-panel--attention" role="alert" th:if="${param.builderUnavailable}">
    <strong>준비된 프로젝트가 없어 Builder로 이동할 수 없습니다.</strong>
    <p>프로젝트를 등록하거나 저장소 연결이 준비될 때까지 기다려 주세요.</p>
  </div>

  <section class="state-panel list-empty-state" role="status" th:if="${#lists.isEmpty(projects)}">
    <span class="list-empty-state__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M6.5 7.5h19v17h-19z"/><path d="M6.5 19.5h5l2.2 3h4.6l2.2-3h5"/><path d="M11 12h10M11 15.5h7"/></svg>
    </span>
    <strong>조회된 내용이 없습니다.</strong>
  </section>

  <div class="table-wrap table-wrap--tall" th:unless="${#lists.isEmpty(projects)}">
    <table class="data-table data-table--dense admin-project-table">
      <thead><tr>
        <th scope="col">프로젝트</th><th scope="col">기획 저장소</th>
        <th scope="col">기본 브랜치</th><th scope="col">상태</th>
      </tr></thead>
      <tbody>
      <tr th:each="p : ${projects}">
        <td><a class="cell" th:href="@{/admin/projects/{n}(n=${p.id})}">
          <strong th:text="${p.name}"></strong>
          <span class="cell__sub num" th:text="${p.id}"></span>
        </a></td>
        <td th:text="${p.repoUrl}"></td>
        <td class="num" th:text="${p.defaultBranch}"></td>
        <td th:text="${p.state.label()}"></td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
