<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout('비밀번호 바꾸기', '카드', null, ~{:: content})}">
<body>
<div th:fragment="content">
  <section class="setup-screen" aria-labelledby="password-title"
           th:with="firstSetup=${#authentication.principal.mustChangePassword}">
    <header class="setup-header">
      <a class="setup-brand" th:href="@{/projects}">WE-ADP <span>Builder</span></a>
      <div class="setup-step" aria-label="최초 설정 진행 단계" th:if="${firstSetup}">
        <span aria-current="step">1</span><i></i><span>2</span>
      </div>
      <a class="button" th:unless="${firstSetup}" th:href="@{/projects}">비밀번호 변경 취소</a>
    </header>

    <div class="setup-intro">
      <p th:text="${firstSetup ? '최초 로그인 · 1단계' : '계정 설정'}">최초 로그인 · 1단계</p>
      <h1 id="password-title" th:text="${firstSetup ? '새 비밀번호 설정' : '비밀번호 바꾸기'}">새 비밀번호 설정</h1>
      <span th:text="${firstSetup
          ? '임시 비밀번호 대신 앞으로 사용할 본인 비밀번호를 설정합니다.'
          : '앞으로 사용할 새 비밀번호를 입력합니다.'}">임시 비밀번호 대신 앞으로 사용할 본인 비밀번호를 설정합니다.</span>
    </div>

    <form method="post" th:action="@{/password}" class="setup-form" novalidate>
      <label for="setup-password">새 비밀번호</label>
      <input id="setup-password" name="newPassword" type="password"
             autocomplete="new-password" required minlength="8"
             aria-describedby="password-help password-error"
             th:attr="aria-invalid=${passwordError != null ? 'true' : null}"
             th:autofocus="${confirmError == null}">
      <p class="setup-field-note" id="password-help">8자 이상이며 임시 비밀번호와 다르게 입력하세요.</p>
      <p class="setup-field-error" id="password-error" role="alert"
         th:if="${passwordError}" th:text="${passwordError}"></p>

      <label for="setup-confirm">새 비밀번호 확인</label>
      <input id="setup-confirm" name="confirm" type="password"
             autocomplete="new-password" required aria-describedby="confirm-error"
             th:attr="aria-invalid=${confirmError != null ? 'true' : null}"
             th:autofocus="${confirmError != null}">
      <p class="setup-field-error" id="confirm-error" role="alert"
         th:if="${confirmError}" th:text="${confirmError}"></p>

      <button type="submit"
              th:attr="data-submit-loading=${firstSetup ? '비밀번호 설정 중' : '비밀번호 변경 중'}"
              th:text="${firstSetup ? '비밀번호 설정 후 계속' : '비밀번호 변경'}">비밀번호 설정 후 계속</button>
    </form>

    <p class="setup-help">보안을 위해 임시 비밀번호는 다시 사용할 수 없습니다.</p>
  </section>
</div>
</body>
</html>
