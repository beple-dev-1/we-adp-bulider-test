<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: layout('로그인', '카드', null, ~{:: content})}">
<body>
<div th:fragment="content">
  <section class="login-screen" aria-labelledby="login-title">
    <header class="login-brand">
      <a th:href="@{/login}">
        <strong>WE-ADP <em>Builder</em></strong>
        <small class="login-brand__version"
               th:text="|v${@environment.getProperty('builder.application-version', '개발')}|">v개발</small>
      </a>
      <span>기획 업무 시스템</span>
    </header>

    <div class="login-intro">
      <p>기획 업무 공간</p>
      <h1 id="login-title">Builder 로그인</h1>
      <span>기획 산출물을 작성하고 관리하는 업무 공간입니다.</span>
    </div>

    <form method="post" th:action="@{/login}" class="login-form">
      <p class="login-error" role="alert" th:if="${param.error}">
        아이디나 비밀번호가 맞지 않습니다. 입력 내용을 확인하고 다시 로그인하세요.
      </p>

      <label for="login-id">아이디</label>
      <input id="login-id" name="username" autocomplete="username" autofocus
             placeholder="Builder 아이디" required>

      <label for="login-password">비밀번호</label>
      <input id="login-password" name="password" type="password"
             autocomplete="current-password" placeholder="비밀번호" required>

      <button type="submit" data-submit-loading="로그인 중">로그인</button>
    </form>

    <aside class="login-first-visit">
      <span aria-hidden="true">i</span>
      <div>
        <strong>처음 로그인하시나요?</strong>
        <p>발급받은 아이디와 임시 비밀번호로 로그인해 새 비밀번호를 설정합니다. Claude Code 계정은 이어서 연결하거나 나중에 연결할 수 있습니다.</p>
      </div>
    </aside>
  </section>
</div>
</body>
</html>
