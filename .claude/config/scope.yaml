# 작업 스코프
#
# /develop {스코프} 로 작업을 시작할 때, AI 가 수정할 수 있는 경로를 여기서 제한한다.
# 스코프를 나누는 기준은 자유다 — 도메인·레이어·모듈 무엇이든 된다.
# 스코프를 쓰지 않으려면 아래 `single` 하나만 남기고 경로를 프로젝트 전체로 둔다.

# 모든 스코프에서 읽고 쓸 수 있는 공통 경로 (유틸·상수 등)
sharedModules:
  - __FILL__                 # 예: src/main/java/com/acme/common/**

# 어느 스코프에서도 건드리지 않는 경로
# 시크릿·운영 설정·생성물이 여기 들어간다
protectedPaths:
  - __FILL__                 # 예: src/main/resources/application-prod.yml

scopes:
  - id: single
    description: __FILL__    # 예: 서비스 전체
    allowedPaths:
      - __FILL__             # 예: src/**
    # 참조만 하고 수정하지 않는 경로 (없으면 빈 배열)
    refReadPaths: []

  # 스코프를 더 나눌 때는 아래 형태로 추가한다.
  # - id: api
  #   description: 외부 공개 API
  #   allowedPaths:
  #     - src/main/java/com/acme/api/**
  #   refReadPaths:
  #     - src/main/java/com/acme/domain/**
