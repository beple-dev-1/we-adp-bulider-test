# 스택 어댑터
#
# 하네스 코어는 기술 스택을 모른다. 스택에 닿는 동작은 모두 이 파일을 통해 정한다.
# 쓰지 않는 항목은 `enabled: false` 로 둔다. 비워두지 말고 반드시 명시한다.
# (빈 값과 "안 씀" 을 구분해야 하네스가 조용히 건너뛰지 않는다)

# ── 형상관리 ────────────────────────────────────────────
vcs:
  kind: __FILL__             # git · svn · none
  # 커밋이 곧 배포인가 (SVN 무브랜치 운영 등). git+PR 흐름이면 false
  #
  # ⚠ 이 값은 **워크플로의 순서를 바꾼다.** 실행 환경 검증(트랙2)이 커밋 앞에 오는지
  #   뒤에 오는지가 여기서 갈린다(정본: rules/testing.md 「트랙2 는 언제 하는가」).
  #   그래서 조용한 기본값을 두지 않고 자리표시자로 둔다 — 안 채우면 게이트가 잡는다.
  #   `false` 를 그냥 박아 두면 커밋=배포 프로젝트가 **조용히 false 로 돌고**
  #   깨진 것을 배포한 뒤에 트랙2 를 하게 된다. 게이트는 그 사실을 알려주지 않는다.
  #   (프리셋 6벌은 각자 값을 갖고 있으므로 /setup 을 쓰면 이 칸은 자동으로 채워진다)
  commitDeploys: __FILL__    # true · false
  # 기본 브랜치 이름 (git 일 때만 의미 있음. svn·none 이면 none)
  #
  # ⚠ 이 값도 **틀리면 조용하다.** `/git` 커밋 절차 0단계가
  #   "현재 브랜치 == defaultBranch" 일 때만 분기하므로, master 를 쓰는데 main 이 적혀 있으면
  #   조건이 거짓이 되어 **분기를 안 하고 기본 브랜치에 직접 커밋된다.**
  #   실패가 아니라 침묵이라 아무 게이트도 안 잡는다(2026-08-31 실측 — 3회차 내내 그랬다).
  #   (/setup 은 VCS_BRANCH 로 탐지해 채운다. 손으로 연동할 때만 이 칸이 노출된다)
  defaultBranch: __FILL__    # 예: main · master · none(svn·형상관리 미사용)
  # 하네스 파일을 소스와 다른 레포에 두는가
  separateHarnessRepo: false

# ── 실행 환경 ───────────────────────────────────────────
# 아래 명령들이 필요로 하는 환경. 명령 문자열에 PC 경로를 박지 않기 위한 자리다.
# 스킬은 명령 실행 전 env 를 내보내고, toolPaths 값을 PATH 앞에 붙인다.
env: {}
#   MAVEN_OPTS: -Djavax.net.ssl.trustStoreType=Windows-ROOT
toolPaths: []
#   - C:/tools/apache-maven-3.9.16/bin

# ── 빌드 ────────────────────────────────────────────────
build:
  enabled: __FILL__          # true · false
  tool: __FILL__             # maven · gradle · npm · ant · make · none
  # 컴파일만 확인하는 명령 (코드리뷰 문법 게이트에 쓰인다)
  compileCommand: __FILL__   # 예: mvn -q -DskipTests compile
  # 전체 빌드 명령
  buildCommand: __FILL__     # 예: mvn -q -DskipTests package

# ── 테스트 ──────────────────────────────────────────────
test:
  enabled: __FILL__
  framework: __FILL__        # junit5 · jest · vitest · pytest · go-test · none
  # 러너가 둘 이상이면(예: 백엔드 junit5 + 화면 vitest) suites 로 나눠 적는다.
  # suites 를 쓰면 아래 runCommand·runAllCommand 대신 각 항목의 명령을 쓴다.
  suites: []
#   - name: backend
#     framework: junit5
#     runCommand: mvn -q -Dtest={target} test
#     runAllCommand: mvn -q test
#   - name: web
#     framework: vitest
#     runCommand: npm --prefix frontend run test -- {target}
#     runAllCommand: npm --prefix frontend run test
  # 러너 명령. {target} 자리에 클래스·파일명이 들어간다
  runCommand: __FILL__       # 예: mvn -q -Dtest={target} test
  runAllCommand: __FILL__
  # 러너만으로 검증되는 범위 — 프레임워크 제약이 있으면 여기에 적는다
  # 예: "순수 함수만. 컨테이너 필요한 코드는 런타임 검증으로 넘긴다"
  scopeNote: __FILL__

# ── 런타임 검증 ─────────────────────────────────────────
# 러너로 확인이 안 되는 것(실제 요청·화면)을 어떻게 보는지
runtime:
  enabled: __FILL__
  # 검증 대상 환경의 주소. 운영 주소는 넣지 않는다
  baseUrl: __FILL__          # 예: http://localhost:8080
  # 기동 명령 (수동으로 띄운다면 none)
  startCommand: __FILL__
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 프로세스를 분리 실행하는 경우가 있다(mvn spring-boot:run 등) —
  # 부모만 죽이면 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다.
  # 안 내리면 다음 단계가 통째로 막히므로, 포트가 실제로 닫혔는지 확인한다.
  stopCommand: none
  # 화면 검증에 브라우저 자동화를 쓰는가 (playwright MCP 등)
  browser: false
  # 화면을 백엔드가 함께 서빙하면 비워둔다. 별도 개발 서버면 그 주소를 적는다
  frontendUrl: ""
  # 화면 검증 스크린샷을 둘 곳 (VCS 에 올리지 않는다)
  screenshotDir: ""          # 예: .work/screenshots

# ── DB ──────────────────────────────────────────────────
# 두 질문을 따로 답한다 — 섞으면 에이전트가 잘못 판단한다
db:
  # 이 프로젝트가 DB 를 쓰는가 (설계·리뷰 판단에 쓰인다)
  used: __FILL__             # true · false
  # 구조(테이블·컬럼)를 조회할 수단이 이 세션에 있는가 (MCP·CLI)
  metaQueryable: __FILL__    # true · false
  vendor: ""                 # postgresql · mysql · h2 · ...
  # 업무 데이터 직접 조회를 막을지 (구조 조회만 허용)
  metaOnly: true

# ── 리뷰 설정 ───────────────────────────────────────────
review:
  # 브리프 교차검토(dev-interview Stage 2)에 쓸 **에이전트 이름**.
  # 허용값 — .claude/agents/ 에 있는 에이전트 이름, 세션이 제공하는 범용 에이전트 이름,
  #          또는 none(교차검토 생략).
  # ⚠ 모델명(sonnet·opus 등)을 여기에 넣지 않는다. 에이전트 조회에 실패한다.
  #   모델을 고르고 싶으면 아래 reviewerModel 을 쓴다.
  reviewerAgent: claude
  # 그 에이전트를 돌릴 모델. 비우면 세션 기본 모델을 쓴다.
  reviewerModel: sonnet
  # 대용량 diff 판정 기준 — 넘으면 /code-review 가 분할 검토로 전환한다
  maxFiles: 40
  maxLines: 2000

# ── 정적 분석 ───────────────────────────────────────────
lint:
  enabled: false
  command: ""                # 예: npx eslint --max-warnings 0 .
  # 보안 규칙 스캐너 (semgrep 등)
  securityCommand: ""
  # 정적 분석에서 뺄 경로 — 빌드 산출물·번들·벤더 코드
  # 안 빼면 minify 된 번들에서 오탐만 쏟아진다 (실측: 번들 1개로 12건)
  excludePaths: []
#   - src/main/resources/static      # 빌드된 화면
#   - dist
#   - vendor
