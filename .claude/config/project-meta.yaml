# HARNESS:UNFILLED — 이 파일을 채운 뒤 이 줄을 지운다. 지우면 작성 완료로 본다.
# 도메인 용어 사전 (권고 — 비어도 동작한다)
#
# 업무에서 쓰는 말과 코드에서 쓰는 이름을 연결한다.
# 이게 있으면 /dev-interview 가 "그게 코드에서 뭐냐" 를 매번 되묻지 않는다.
#
# 채우는 요령
#   - 기획서·회의에서 나오는 말 중 코드 이름과 다른 것만 적는다
#   - 같은 것을 여러 이름으로 부르는 경우를 특히 적는다 (오해가 여기서 난다)
#   - 전부 적으려 하지 않는다. 헷갈리는 20개가 전부 적은 200개보다 낫다

# 업무 용어 → 코드 이름
terms: []
# 샘플 (주석을 풀고 프로젝트 것으로 바꾼다)
#   - word: 주문서
#     aliases: [오더, 주문건]
#     code: Order
#     tables: [orders, order_items]
#     note: 결제 완료 전에는 Cart 이며 Order 로 전환된다
#
#   - word: 정산
#     aliases: [세틀먼트, 마감]
#     code: Settlement
#     tables: [settlements, settlement_details]
#     note: 일 단위 마감이며 월 정산은 집계 결과다 (별 테이블)
#
#   - word: 가맹점
#     aliases: [머천트, 파트너, 점포]
#     code: Merchant
#     tables: [merchants]
#     note: 계약 주체는 Merchant, 실제 영업 장소는 Store 로 분리돼 있다

# 상태 코드 사전 — 숫자·약어로 된 상태값의 뜻
statuses: []
# 샘플
#   - field: order_status
#     values:
#       "10": 접수
#       "20": 결제완료
#       "30": 배송중
#       "90": 취소
#     note: 40~80 은 과거에 쓰다 폐기됨. 신규 코드에서 쓰지 않는다

# 보안 탐색 키워드 — security-auditor 가 코드에서 찾을 말
# 이 프로젝트에서 민감한 것이 무엇인지는 도메인마다 다르다. 비면 에이전트가 일반 패턴만 본다.
securityKeywords: []
# 샘플
#   - 주민등록번호
#   - 계좌번호
#   - 카드번호
#   - 인증서
#   - 개인정보

# 외부 시스템 이름
systems: []
# 샘플
#   - name: 결제 PG
#     code: PaymentGatewayClient
#     note: 승인·취소만 위임. 환불 정책 판단은 우리 쪽 책임
