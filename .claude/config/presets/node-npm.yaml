# 프리셋 — TypeScript · Node · npm
#
# 탐지 신호: package.json 이 있고 pom.xml·build.gradle 이 없다
# 검증 상태: 실사용 검증됨 (이 명령 형태로 과업 1건 완주)
#
# /setup 이 이 파일을 config/stack.yaml 로 복사한 뒤
# 프로젝트마다 다른 값(baseUrl 포트·테스트 러너 등)만 덮어쓴다.
# 손으로 써도 된다 — 복사해서 값만 바꾸면 그게 연동이다.
#
# 주의 — package.json 의 scripts 에 실제로 있는 이름을 써야 한다.
# typecheck·build·dev 가 없는 프로젝트가 흔하다. /setup 이 확인해 준다.

vcs:
  kind: git
  commitDeploys: false
  # 실제 브랜치 이름으로 채운다. 틀리면 /git 이 기본 브랜치 보호를 건너뛴다 —
  # 조용히 직접 커밋되고 아무 게이트도 안 잡는다(2026-08-31 실측).
  # /setup 이 VCS_BRANCH 탐지값으로 채운다. svn·형상관리 미사용이면 none.
  defaultBranch: __FILL__    # 예: main · master · none
  separateHarnessRepo: false

# 명령이 필요로 하는 환경. 명령 문자열에 PC 경로를 박지 않기 위한 자리다.
# node·npm 이 PATH 에 없거나 버전 관리자(nvm·volta)를 쓰면 toolPaths 로 뺀다.
env: {}
toolPaths: []

build:
  enabled: true
  tool: npm
  compileCommand: npm run typecheck
  buildCommand: npm run build

test:
  enabled: true
  framework: vitest
  # 러너가 둘 이상이면 suites 로 나눈다. && 로 묶으면 어느 쪽이 실패했는지 사라진다.
  suites: []
  runCommand: npx vitest run {target}
  runAllCommand: npx vitest run
  scopeNote: >
    유닛·컴포넌트 테스트까지 러너로 검증한다(jsdom).
    실제 브라우저 렌더와 E2E 만 런타임 검증으로 넘긴다.

runtime:
  enabled: true
  baseUrl: http://localhost:5173
  startCommand: npm run dev
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 JVM/프로세스를 분리 실행하는 경우가 있다 — 부모만 죽이면
  # 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다. 포트가 실제로 닫혔는지 본다.
  stopCommand: none
  browser: true
  # 화면을 백엔드가 함께 서빙하면 비워둔다. 별도 개발 서버면 그 주소를 적는다
  frontendUrl: ""
  # 화면 검증 스크린샷을 둘 곳 (VCS 에 올리지 않는다)
  screenshotDir: ""

db:
  used: false
  metaQueryable: false
  vendor: ""
  metaOnly: true

review:
  reviewerAgent: claude      # 에이전트 이름 또는 none. 모델명을 넣지 않는다
  reviewerModel: sonnet      # 비우면 세션 기본 모델
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: true
  command: npx eslint --max-warnings 0 .
  securityCommand: ""
  # 정적 분석에서 뺄 경로 — 빌드 산출물·번들·벤더 코드
  excludePaths: []
