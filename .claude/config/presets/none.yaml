# 프리셋 — 빌드·테스트·런타임이 없는 저장소
#
# 탐지 신호: 빌드 파일(pom.xml·package.json·build.gradle·go.mod·pyproject.toml 등)이 없다
# 검증 상태: 검증 불필요 — 실행할 명령이 없다
#
# 쓰는 곳 — 문서 저장소 · 설정 저장소 · 스크립트 모음 · 이제 시작하는 프로젝트.
# 나중에 빌드가 생기면 그때 프리셋을 다시 적용하면 된다(/setup 을 다시 부른다).
#
# **비워두지 않고 false·none 을 명시하는 이유** —
# 하네스는 "빈 값" 과 "안 씀" 을 구분한다. 비워두면 조용히 건너뛰는 대신
# 설정이 덜 됐다고 보고 멈춘다. false 라고 적으면 "의도적으로 안 쓴다" 가 된다.

vcs:
  kind: git
  commitDeploys: false
  # 실제 브랜치 이름으로 채운다. 틀리면 /git 이 기본 브랜치 보호를 건너뛴다 —
  # 조용히 직접 커밋되고 아무 게이트도 안 잡는다(2026-08-31 실측).
  # /setup 이 VCS_BRANCH 탐지값으로 채운다. svn·형상관리 미사용이면 none.
  defaultBranch: __FILL__    # 예: main · master · none
  separateHarnessRepo: false

env: {}
toolPaths: []

build:
  enabled: false
  tool: none
  compileCommand: none
  buildCommand: none

test:
  enabled: false
  framework: none
  suites: []
  runCommand: none
  runAllCommand: none
  scopeNote: 테스트 러너 없음 — 검증은 전부 사람이 눈으로 확인한다

runtime:
  enabled: false
  baseUrl: none
  startCommand: none
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 JVM/프로세스를 분리 실행하는 경우가 있다 — 부모만 죽이면
  # 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다. 포트가 실제로 닫혔는지 본다.
  stopCommand: none
  browser: false
  frontendUrl: ""
  screenshotDir: ""

db:
  used: false
  metaQueryable: false
  vendor: ""
  metaOnly: true

review:
  reviewerAgent: claude
  reviewerModel: sonnet
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: false
  command: ""
  securityCommand: ""
  excludePaths: []
