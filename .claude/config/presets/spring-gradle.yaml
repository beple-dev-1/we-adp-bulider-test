# 프리셋 — Java · Spring Boot · Gradle
#
# 탐지 신호: build.gradle 또는 build.gradle.kts 가 있고 spring 문자열이 들어 있다
# 검증 상태: **미검증** — 명령 형태만 옮겼고 실제 과업으로 완주한 적이 없다.
#             /setup 이 적용 직후 --verify-commands 로 실제 실행을 확인한다.
#             거기서 실패하면 그 자리에서 고친다.
#
# 래퍼(gradlew)가 있으면 gradle 대신 ./gradlew 를 쓴다. /setup 이 확인해 바꿔준다.

vcs:
  kind: git
  commitDeploys: false
  # 실제 브랜치 이름으로 채운다. 틀리면 /git 이 기본 브랜치 보호를 건너뛴다 —
  # 조용히 직접 커밋되고 아무 게이트도 안 잡는다(2026-08-31 실측).
  # /setup 이 VCS_BRANCH 탐지값으로 채운다. svn·형상관리 미사용이면 none.
  defaultBranch: __FILL__    # 예: main · master · none
  separateHarnessRepo: false

env: {}
toolPaths: []

build:
  enabled: true
  tool: gradle
  compileCommand: ./gradlew compileJava -q
  buildCommand: ./gradlew build -x test -q

test:
  enabled: true
  framework: junit5
  suites: []
  runCommand: ./gradlew test --tests {target}
  runAllCommand: ./gradlew test
  scopeNote: >
    순수 로직과 @WebMvcTest·@DataJpaTest 슬라이스까지 러너로 검증한다.
    외부 시스템 연동과 실제 화면 확인만 런타임 검증으로 넘긴다.

runtime:
  enabled: true
  baseUrl: http://localhost:8080
  startCommand: ./gradlew bootRun
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 JVM/프로세스를 분리 실행하는 경우가 있다 — 부모만 죽이면
  # 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다. 포트가 실제로 닫혔는지 본다.
  stopCommand: none
  browser: false
  frontendUrl: ""
  screenshotDir: ""

db:
  used: false
  metaQueryable: false
  vendor: ""
  metaOnly: true

review:
  reviewerAgent: claude
  reviewerModel: sonnet
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: false
  command: ""
  securityCommand: ""
  excludePaths: []
