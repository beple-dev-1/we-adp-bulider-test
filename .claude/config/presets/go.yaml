# 프리셋 — Go
#
# 탐지 신호: go.mod 가 있다
# 검증 상태: **미검증** — 명령 형태만 옮겼고 실제 과업으로 완주한 적이 없다.
#             /setup 이 적용 직후 --verify-commands 로 실제 실행을 확인한다.
#
# Go 는 빌드와 테스트 명령이 표준이라 프로젝트마다 거의 같다.
# runCommand 의 {target} 에는 패키지 경로나 -run 패턴이 들어간다.

vcs:
  kind: git
  commitDeploys: false
  # 실제 브랜치 이름으로 채운다. 틀리면 /git 이 기본 브랜치 보호를 건너뛴다 —
  # 조용히 직접 커밋되고 아무 게이트도 안 잡는다(2026-08-31 실측).
  # /setup 이 VCS_BRANCH 탐지값으로 채운다. svn·형상관리 미사용이면 none.
  defaultBranch: __FILL__    # 예: main · master · none
  separateHarnessRepo: false

env: {}
toolPaths: []

build:
  enabled: true
  tool: none
  compileCommand: go build ./...
  buildCommand: go build ./...

test:
  enabled: true
  framework: go-test
  suites: []
  runCommand: go test -run {target} ./...
  runAllCommand: go test ./...
  scopeNote: >
    표준 테스트로 갈 수 있는 범위까지 러너로 검증한다.
    실제 외부 연동과 통합 흐름만 런타임 검증으로 넘긴다.

runtime:
  enabled: true
  baseUrl: http://localhost:8080
  startCommand: go run .
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 JVM/프로세스를 분리 실행하는 경우가 있다 — 부모만 죽이면
  # 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다. 포트가 실제로 닫혔는지 본다.
  stopCommand: none
  browser: false
  frontendUrl: ""
  screenshotDir: ""

db:
  used: false
  metaQueryable: false
  vendor: ""
  metaOnly: true

review:
  reviewerAgent: claude
  reviewerModel: sonnet
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: true
  command: go vet ./...
  securityCommand: ""
  excludePaths: []
