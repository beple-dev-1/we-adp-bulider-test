# 프리셋 — Java · Spring Boot · Maven
#
# 탐지 신호: pom.xml 이 있고 spring-boot 문자열이 들어 있다
# 검증 상태: 실사용 검증됨 (이 명령 형태로 과업 3건 완주)
#
# /setup 이 이 파일을 config/stack.yaml 로 복사한 뒤
# 프로젝트마다 다른 값(baseUrl 포트·DB 종류 등)만 덮어쓴다.
# 손으로 써도 된다 — 복사해서 값만 바꾸면 그게 연동이다.

vcs:
  kind: git
  commitDeploys: false
  # 실제 브랜치 이름으로 채운다. 틀리면 /git 이 기본 브랜치 보호를 건너뛴다 —
  # 조용히 직접 커밋되고 아무 게이트도 안 잡는다(2026-08-31 실측).
  # /setup 이 VCS_BRANCH 탐지값으로 채운다. svn·형상관리 미사용이면 none.
  defaultBranch: __FILL__    # 예: main · master · none
  separateHarnessRepo: false

# 명령이 필요로 하는 환경. 명령 문자열에 PC 경로를 박지 않기 위한 자리다.
# mvn 이 PATH 에 없는 PC 가 흔하다 — 그 경우 toolPaths 에 Maven bin 경로를 넣는다.
# detect-stack.sh 의 TOOL_PATH_CANDIDATE_MVN 이 후보를 찾아 낸다.
env: {}
toolPaths: []

build:
  enabled: true
  tool: maven
  compileCommand: mvn -q -DskipTests compile
  buildCommand: mvn -q -DskipTests package

test:
  enabled: true
  framework: junit5
  # 러너가 둘 이상이면(백엔드 junit5 + 화면 vitest 등) suites 로 나눈다.
  # 한 명령에 && 로 묶으면 어느 러너가 실패했는지 결과서에서 사라진다.
  suites: []
  runCommand: mvn -q -Dtest={target} test
  runAllCommand: mvn -q test
  # Spring 은 슬라이스 테스트가 되므로 러너 범위가 넓다
  scopeNote: >
    순수 로직과 @WebMvcTest·@DataJpaTest 슬라이스까지 러너로 검증한다.
    외부 시스템 연동과 실제 화면 확인만 런타임 검증으로 넘긴다.

runtime:
  enabled: true
  baseUrl: http://localhost:8080
  startCommand: mvn -q spring-boot:run
  # 내리는 명령. 비우면 수동으로 내린다.
  # 빌드 도구가 자식 JVM/프로세스를 분리 실행하는 경우가 있다 — 부모만 죽이면
  # 자식이 orphan 으로 남아 포트와 파일DB 락을 계속 점유한다. 포트가 실제로 닫혔는지 본다.
  stopCommand: none
  browser: false
  # 화면을 백엔드가 함께 서빙하면 비워둔다. 별도 개발 서버면 그 주소를 적는다
  frontendUrl: ""
  # 화면 검증 스크린샷을 둘 곳 (VCS 에 올리지 않는다)
  screenshotDir: ""

db:
  used: true
  metaQueryable: true        # postgres MCP·psql 등 조회 수단이 있는 경우
  vendor: postgresql
  metaOnly: true

review:
  reviewerAgent: claude      # 에이전트 이름 또는 none. 모델명을 넣지 않는다
  reviewerModel: sonnet      # 비우면 세션 기본 모델
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: true
  command: mvn -q spotless:check
  securityCommand: semgrep --config .claude/semgrep-rules/project.yaml --error
  # 정적 분석에서 뺄 경로 — 빌드 산출물·번들·벤더 코드.
  # 안 빼면 minify 된 번들에서 오탐만 쏟아진다 (실측: 번들 1개로 12건)
  excludePaths: []
