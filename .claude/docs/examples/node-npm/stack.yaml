# 채워진 예시 — TypeScript · Node · npm · git · DB 미사용(백엔드가 별 서비스)

vcs:
  kind: git
  # ⚠ 이 두 값은 **프로젝트마다 다르다.** 이 예시를 복사해 쓸 때 그대로 두지 말고 확인한다.
  #   템플릿(config/stack.yaml)은 __FILL__ 로 두어 게이트가 잡지만, 예시를 복사하면 그 보호를 지나친다.
  commitDeploys: false
  defaultBranch: main
  separateHarnessRepo: false

build:
  enabled: true
  tool: npm
  compileCommand: npm run typecheck
  buildCommand: npm run build

test:
  enabled: true
  framework: vitest
  runCommand: npx vitest run {target}
  runAllCommand: npx vitest run
  scopeNote: >
    유닛·컴포넌트 테스트까지 러너로 검증한다(jsdom).
    실제 브라우저 렌더와 E2E 만 런타임 검증으로 넘긴다.

runtime:
  enabled: true
  baseUrl: http://localhost:5173
  startCommand: npm run dev
  # 내리는 명령. 비우면 수동으로 내린다
  stopCommand: none
  browser: true

db:
  used: false
  metaQueryable: false
  vendor: ""
  metaOnly: true

review:
  reviewerAgent: claude      # 에이전트 이름 또는 none. 모델명을 넣지 않는다
  reviewerModel: sonnet      # 비우면 세션 기본 모델
  maxFiles: 40
  maxLines: 2000

lint:
  enabled: true
  command: npx eslint --max-warnings 0 .
  securityCommand: ""
