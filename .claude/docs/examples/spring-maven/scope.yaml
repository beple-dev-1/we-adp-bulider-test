# 채워진 예시 — 레이어가 아니라 업무 도메인으로 스코프를 나눈 경우

sharedModules:
  - src/main/java/com/acme/order/common/**
  - src/main/java/com/acme/order/config/**

protectedPaths:
  - src/main/resources/application-prod.yml
  - src/main/resources/application-stg.yml
  - .env
  - .env.*
  - deploy/secrets/**

scopes:
  - id: order
    description: 주문 접수·상태 전이
    allowedPaths:
      - src/main/java/com/acme/order/order/**
      - src/test/java/com/acme/order/order/**
    refReadPaths:
      - src/main/java/com/acme/order/settlement/**

  - id: settlement
    description: 정산·마감
    allowedPaths:
      - src/main/java/com/acme/order/settlement/**
      - src/test/java/com/acme/order/settlement/**
    refReadPaths:
      - src/main/java/com/acme/order/order/**

  - id: infra
    description: 외부 연동 클라이언트·스키마
    allowedPaths:
      - src/main/java/com/acme/order/infra/**
      - src/test/java/com/acme/order/infra/**
      - src/main/resources/db/migration/**
    refReadPaths: []
