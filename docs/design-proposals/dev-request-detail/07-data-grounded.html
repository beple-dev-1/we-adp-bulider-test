  <style>
    .dr7 { display: grid; gap: 20px; color: #29282c; }
    .dr7-head { padding-bottom: 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--color-line); }
    .dr7-head__id { display: block; margin-bottom: 6px; color: var(--color-action-primary); font-family: ui-monospace, monospace; font-size: .75rem; font-weight: 800; }
    .dr7-head h1 { margin: 0; font-size: 1.75rem; line-height: 1.3; letter-spacing: -.02em; }
    .dr7-head p { margin: 8px 0 0; color: var(--color-muted); font-size: .875rem; line-height: 1.6; }
    .dr7-head__actions { display: flex; align-items: center; gap: 8px; flex: none; }

    .dr7-source { overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; border: 1px solid #cec2e5; border-radius: var(--radius-panel); background: #fbf9fd; }
    .dr7-source__copy { min-width: 0; padding: 22px 24px; }
    .dr7-label { display: block; color: var(--color-action-primary); font-size: .75rem; font-weight: 800; }
    .dr7-source h2 { margin: 7px 0 0; font-size: 1rem; }
    .dr7-source p { max-width: 78ch; margin: 8px 0 0; color: #504d55; font-size: .875rem; line-height: 1.72; }
    .dr7-counts { margin: 0; display: grid; grid-template-columns: repeat(3, 104px); background: #fff; }
    .dr7-counts div { padding: 18px; display: grid; align-content: center; border-left: 1px solid var(--color-line); }
    .dr7-counts dt { color: var(--color-muted); font-size: .72rem; }
    .dr7-counts dd { margin: 5px 0 0; font-size: 1.1rem; font-weight: 800; }

    .dr7-meta { margin: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-canvas); }
    .dr7-meta div { min-width: 0; padding: 13px 15px; border-right: 1px solid var(--color-line); }
    .dr7-meta div:last-child { border-right: 0; }
    .dr7-meta dt { color: var(--color-muted); font-size: .72rem; }
    .dr7-meta dd { margin: 5px 0 0; overflow-wrap: anywhere; font-size: .8125rem; font-weight: 750; line-height: 1.4; }

    .dr7-primary { display: grid; grid-template-columns: minmax(0, 1fr) 350px; align-items: start; gap: 16px; }
    .dr7-panel { min-width: 0; overflow: hidden; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-canvas); }
    .dr7-panel__head { min-height: 70px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--color-line); background: #fcfbfa; }
    .dr7-panel__head h2 { margin: 0; font-size: 1rem; }
    .dr7-panel__head p { margin: 5px 0 0; color: var(--color-muted); font-size: .75rem; line-height: 1.5; }
    .dr7-panel__count { flex: none; color: var(--color-action-primary); font-size: .75rem; font-weight: 800; }

    .dr7-scope-list { margin: 0; padding: 0; list-style: none; }
    .dr7-scope-list > li { min-width: 0; padding: 19px 20px; display: grid; grid-template-columns: 38px minmax(200px, .8fr) minmax(0, 1.2fr); gap: 15px; border-bottom: 1px solid var(--color-line); }
    .dr7-scope-list > li:last-child { border-bottom: 0; }
    .dr7-number { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--color-action-primary); font-family: ui-monospace, monospace; font-size: .72rem; font-weight: 800; }
    .dr7-scope-title { min-width: 0; }
    .dr7-scope-title strong { display: block; font-size: .875rem; line-height: 1.5; }
    .dr7-scope-title span { margin-top: 6px; display: inline-flex; padding: 5px 8px; border-radius: 999px; color: #347251; background: #eaf5ed; font-size: .72rem; font-weight: 800; }
    .dr7-scope-note { min-width: 0; padding-left: 16px; border-left: 1px solid var(--color-line); }
    .dr7-scope-note b { display: block; margin-bottom: 7px; color: var(--color-muted); font-size: .72rem; }
    .dr7-scope-note p { margin: 0; color: #504e53; font-size: .8125rem; line-height: 1.65; }

    .dr7-review-stack { display: grid; gap: 12px; }
    .dr7-review { overflow: hidden; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-canvas); }
    .dr7-review--issue { border-color: #ead8b2; }
    .dr7-review h2 { margin: 0; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--color-line); font-size: .875rem; }
    .dr7-review--issue h2 { color: #76511b; border-bottom-color: #ead8b2; background: #fff8e9; }
    .dr7-review h2 span { font-size: .72rem; }
    .dr7-review ol, .dr7-review ul { margin: 0; padding: 0; list-style: none; }
    .dr7-review li { padding: 14px 17px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 9px; color: #4f4d52; font-size: .8125rem; line-height: 1.6; border-bottom: 1px solid var(--color-line); }
    .dr7-review li:last-child { border-bottom: 0; }
    .dr7-review--issue li { background: #fffcf6; }
    .dr7-check, .dr7-alert-mark { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-size: .68rem; font-weight: 900; }
    .dr7-check { color: #347251; background: #eaf5ed; }
    .dr7-alert-mark { color: #76511b; background: #f6e5c0; }

    .dr7-implementation { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); gap: 16px; }
    .dr7-screen-list { margin: 0; padding: 0; list-style: none; }
    .dr7-screen-list > li { padding: 19px 20px; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 22px; border-bottom: 1px solid var(--color-line); }
    .dr7-screen-list > li:last-child { border-bottom: 0; }
    .dr7-screen-name span { color: var(--color-muted); font-size: .72rem; }
    .dr7-screen-name strong { margin-top: 5px; display: block; font-size: .875rem; }
    .dr7-code { margin-top: 5px; display: block; color: var(--color-action-primary) !important; font-family: ui-monospace, monospace; font-size: .75rem !important; }
    .dr7-change h3, .dr7-backend h3 { margin: 0 0 8px; color: var(--color-muted); font-size: .72rem; }
    .dr7-list { margin: 0; padding-left: 1rem; font-size: .8125rem; line-height: 1.68; }
    .dr7-list li + li { margin-top: 4px; }

    .dr7-backend-list { margin: 0; padding: 0; list-style: none; }
    .dr7-backend { padding: 17px 18px; border-bottom: 1px solid var(--color-line); }
    .dr7-backend:last-child { border-bottom: 0; }
    .dr7-backend__top { display: flex; align-items: center; gap: 9px; }
    .dr7-backend__type { padding: 5px 8px; border-radius: 999px; color: var(--color-action-primary); background: var(--color-action-primary-soft); font-size: .72rem; font-weight: 800; }
    .dr7-backend__top strong { font-size: .8125rem; }
    .dr7-backend p { margin: 9px 0 0; color: #504e53; font-size: .8125rem; line-height: 1.65; }

    .dr7-boundary { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .dr7-boundary .dr7-panel__head { min-height: 62px; }
    .dr7-boundary-list { margin: 0; padding: 0; list-style: none; }
    .dr7-boundary-list li { padding: 16px 20px; border-bottom: 1px solid var(--color-line); }
    .dr7-boundary-list li:last-child { border-bottom: 0; }
    .dr7-boundary-list strong { display: block; font-size: .8125rem; }
    .dr7-boundary-list p { margin: 6px 0 0; color: var(--color-muted); font-size: .78rem; line-height: 1.6; }

    @media (max-width: 1050px) {
      .dr7-primary, .dr7-implementation { grid-template-columns: 1fr; }
      .dr7-review-stack { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .dr7-head { align-items: stretch; flex-direction: column; }
      .dr7-head__actions { display: grid; }
      .dr7-source { grid-template-columns: 1fr; }
      .dr7-counts { grid-template-columns: repeat(3, 1fr); }
      .dr7-counts div { border-top: 1px solid var(--color-line); }
      .dr7-meta { grid-template-columns: 1fr 1fr; }
      .dr7-meta div:nth-child(even) { border-right: 0; }
      .dr7-review-stack, .dr7-boundary { grid-template-columns: 1fr; }
      .dr7-scope-list > li { grid-template-columns: 38px minmax(0, 1fr); }
      .dr7-scope-note { grid-column: 2; padding: 12px 0 0; border-top: 1px solid var(--color-line); border-left: 0; }
      .dr7-screen-list > li { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>

<template id="본문">
  <div class="dr7">

        <li><span class="dr7-number">01</span><div class="dr7-scope-title"><strong>결재 문서 직접 임시 저장</strong><span>개발</span></div><div class="dr7-scope-note"><b>분석 메모</b><p>사용자가 원하는 시점에 현재 작성 내용을 저장할 수 있어야 합니다.</p></div></li>
