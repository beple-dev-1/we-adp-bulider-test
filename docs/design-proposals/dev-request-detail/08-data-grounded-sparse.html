  <title>개발요청서 상세 · 정보가 적은 상태</title>
  <style>
    .dr8 { display: grid; gap: 20px; color: #29282c; }
    .dr8-head { padding-bottom: 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--color-line); }
    .dr8-head__id { display: block; margin-bottom: 6px; color: var(--color-action-primary); font-family: ui-monospace, monospace; font-size: .75rem; font-weight: 800; }
    .dr8-head h1 { margin: 0; font-size: 1.75rem; line-height: 1.3; letter-spacing: -.02em; }
    .dr8-head p { margin: 8px 0 0; color: var(--color-muted); font-size: .875rem; line-height: 1.6; }
    .dr8-head__actions { display: flex; align-items: center; gap: 8px; flex: none; }

    .dr8-source { overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; border: 1px solid #cec2e5; border-radius: var(--radius-panel); background: #fbf9fd; }
    .dr8-source__copy { min-width: 0; padding: 22px 24px; }
    .dr8-label { display: block; color: var(--color-action-primary); font-size: .75rem; font-weight: 800; }
    .dr8-source h2 { margin: 7px 0 0; font-size: 1rem; }
    .dr8-source p { max-width: 78ch; margin: 8px 0 0; color: #504d55; font-size: .875rem; line-height: 1.72; }
    .dr8-counts { margin: 0; display: grid; grid-template-columns: repeat(3, 104px); background: #fff; }
    .dr8-counts div { padding: 18px; display: grid; align-content: center; border-left: 1px solid var(--color-line); }
    .dr8-counts dt { color: var(--color-muted); font-size: .72rem; }
    .dr8-counts dd { margin: 5px 0 0; font-size: 1.1rem; font-weight: 800; }
    .dr8-counts .is-zero dd { color: #aaa6ad; }

    .dr8-meta { margin: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-canvas); }
    .dr8-meta div { min-width: 0; padding: 13px 15px; border-right: 1px solid var(--color-line); }
    .dr8-meta div:last-child { border-right: 0; }
    .dr8-meta dt { color: var(--color-muted); font-size: .72rem; }
    .dr8-meta dd { margin: 5px 0 0; overflow-wrap: anywhere; font-size: .8125rem; font-weight: 750; line-height: 1.4; }

    .dr8-main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; align-items: start; gap: 16px; }
    .dr8-panel { min-width: 0; overflow: hidden; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-canvas); }
    .dr8-panel__head { min-height: 70px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--color-line); background: #fcfbfa; }
    .dr8-panel__head h2 { margin: 0; font-size: 1rem; }
    .dr8-panel__head p { margin: 5px 0 0; color: var(--color-muted); font-size: .75rem; line-height: 1.5; }
    .dr8-panel__count { flex: none; color: var(--color-action-primary); font-size: .75rem; font-weight: 800; }

    .dr8-scope { padding: 21px 20px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 15px; }
    .dr8-number { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--color-action-primary); font-family: ui-monospace, monospace; font-size: .72rem; font-weight: 800; }
    .dr8-scope strong { display: block; font-size: .875rem; line-height: 1.5; }
    .dr8-scope p { margin: 6px 0 0; color: var(--color-muted); font-size: .8125rem; line-height: 1.6; }
    .dr8-nature { padding: 5px 8px; border-radius: 999px; color: #347251; background: #eaf5ed; font-size: .72rem; font-weight: 800; }

    .dr8-done { margin: 0; padding: 0; list-style: none; }
    .dr8-done li { padding: 18px 20px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; font-size: .8125rem; line-height: 1.65; }
    .dr8-check { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: #347251; background: #eaf5ed; font-size: .68rem; font-weight: 900; }

    .dr8-backend { padding: 20px; display: grid; grid-template-columns: 130px 200px minmax(0, 1fr); gap: 20px; align-items: start; }
    .dr8-backend h3 { margin: 0 0 7px; color: var(--color-muted); font-size: .72rem; }
    .dr8-backend__type { width: fit-content; padding: 6px 9px; border-radius: 999px; color: var(--color-action-primary); background: var(--color-action-primary-soft); font-size: .75rem; font-weight: 800; }
    .dr8-backend strong { display: block; font-size: .875rem; }
    .dr8-backend p { margin: 0; color: #504e53; font-size: .8125rem; line-height: 1.68; }

    @media (max-width: 900px) {
      .dr8-main { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .dr8-head { align-items: stretch; flex-direction: column; }
      .dr8-head__actions { display: grid; }
      .dr8-source { grid-template-columns: 1fr; }
      .dr8-counts { grid-template-columns: repeat(3, 1fr); }
      .dr8-counts div { border-top: 1px solid var(--color-line); }
      .dr8-meta { grid-template-columns: 1fr 1fr; }
      .dr8-meta div:nth-child(even) { border-right: 0; }
      .dr8-scope { grid-template-columns: 38px minmax(0, 1fr); }
      .dr8-nature { grid-column: 2; width: fit-content; }
      .dr8-backend { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
