<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 4 · 개발 인계 보드형</title><link rel="stylesheet" href="_variants.css"></head><body>
<template id="시안본문"><div class="handoff-top"><section class="card handoff-brief"><span class="eyebrow">개발 목표</span><h2>작성 중인 결재 문서를 잃지 않고 저장하고, 나중에 이어 작성할 수 있게 합니다.</h2><div class="meta-line"><span>시스템 <b>웹빌더</b></span><span>적용 대상 <b>통합</b></span><span>기준 <b>FRD-003</b></span></div></section><section class="card handoff-gate"><h3>착수 조건</h3><ul><li>임시 저장 문서 보관 기간 확정</li><li>기존 결재 작성 권한 정책 유지</li><li>완료 문서 정책은 범위에서 제외</li></ul></section></div>
<div class="board"><section class="card board-column"><header><h3>화면 작업</h3><span class="chip">2개</span></header><article class="task"><strong>결재 문서 작성</strong><p>임시 저장 버튼, 마지막 저장 시각, 저장 중 상태</p></article><article class="task"><strong>임시 저장 문서함</strong><p>목록, 이어쓰기, 삭제</p></article></section><section class="card board-column"><header><h3>화면 외 작업</h3><span class="chip">3건</span></header><article class="task"><strong>동시 저장 처리</strong><p>직접 저장과 자동 저장의 중복 실행 차단</p></article><article class="task"><strong>실패 복구</strong><p>작성 내용 유지와 재시도 안내</p></article><article class="task"><strong>접근 권한</strong><p>작성자 본인만 조회·수정</p></article></section><section class="card board-column"><header><h3>완료 확인</h3><span class="chip">3건</span></header><article class="task"><strong>중복 저장 없음</strong><p>같은 시점의 저장 요청은 한 번만 처리</p></article><article class="task"><strong>내용 유실 없음</strong><p>실패해도 작성 내용 유지</p></article><article class="task"><strong>권한 위반 없음</strong><p>다른 작성자의 문서 접근 차단</p></article></section></div>
<section class="card" style="margin-top:14px;padding:18px"><h2 class="section-title">개발팀 전달사항</h2><p class="sub">일정, 우선순위, 기존 데이터 확인 사항을 착수 조건과 분리해 기록합니다.</p></section></template><script src="_shell.js"></script><script>시안('04','개발 인계 보드형')</script></body></html>
