<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>시안 3 · 고밀도 영향도 표형</title>
  <link rel="stylesheet" href="_variants.css">
</head>
<body>
<template id="시안본문">
  <section class="card matrix-summary">
    <div>
      <span class="eyebrow">요청 요약</span>
      <h2 class="section-title">결재 문서 임시 저장과 이어쓰기를 제공합니다.</h2>
      <p class="sub">개발 범위와 영향 대상을 연결해 개발팀이 구현 내용과 완료 조건을 한 번에 대조합니다.</p>
    </div>
    <div class="matrix-stat"><span>개발 범위</span><b>3건</b></div>
    <div class="matrix-stat"><span>작업 화면</span><b>2개</b></div>
    <div class="matrix-stat"><span>화면 외 구현</span><b>3건</b></div>
  </section>

  <dl class="matrix-meta">
    <div><span>개발요청서</span><b>DR-003</b></div>
    <div><span>시스템</span><b>웹빌더</b></div>
    <div><span>적용 대상</span><b>통합</b></div>
    <div><span>기준 FRD</span><b>FRD-003</b></div>
    <div><span>생성 시각</span><b>2026-08-12 16:30</b></div>
    <div><span>전달 상태</span><b>개발팀 전달 대기</b></div>
  </dl>

  <div class="notice" style="margin-top:14px"><b>착수 전 확인 1건</b>　기존 임시 저장 문서의 보관 기간을 운영 정책 확인 후 확정해야 합니다.</div>

  <section class="card matrix-card" aria-labelledby="scope-matrix-title">
    <header class="matrix-tools">
      <div><h2 id="scope-matrix-title">개발 범위 및 영향도</h2><p>요구사항별 적용 화면, 구현 내용, 완료 기준을 연결해 확인합니다.</p></div>
      <span class="chip">3건</span>
    </header>
    <div class="proposal-table-wrap">
      <table class="matrix-primary">
        <thead><tr><th scope="col">번호</th><th scope="col">개발 항목</th><th scope="col">적용 대상</th><th scope="col">상세 구현</th><th scope="col">완료 기준</th><th scope="col">영향</th></tr></thead>
        <tbody>
          <tr>
            <td class="matrix-row-number">01</td>
            <td><strong>결재 문서 직접 임시 저장</strong><span class="matrix-link">FRD-003 / 범위 1</span></td>
            <td><strong>결재 문서 작성</strong><span class="matrix-link">wv-appr-write</span></td>
            <td><ul class="matrix-detail-list"><li>사용자가 원하는 시점에 현재 작성 내용을 저장</li><li>저장 중 버튼 비활성화와 처리 상태 표시</li><li>저장 완료 후 마지막 저장 시각 갱신</li></ul></td>
            <td><ul class="matrix-detail-list"><li>직접·자동 저장 중복 실행 방지</li><li>저장 완료 시각이 실제 처리 시각과 일치</li></ul></td>
            <td class="impact">높음</td>
          </tr>
          <tr>
            <td class="matrix-row-number">02</td>
            <td><strong>작성 내용 자동 저장</strong><span class="matrix-link">FRD-003 / 범위 2</span></td>
            <td><strong>결재 문서 작성</strong><span class="matrix-link">wv-appr-write</span></td>
            <td><ul class="matrix-detail-list"><li>마지막 내용 변경 후 30초가 지나면 자동 저장</li><li>변경이 없으면 저장 요청을 보내지 않음</li><li>실패 시 작성 내용 유지와 재시도 안내</li></ul></td>
            <td><ul class="matrix-detail-list"><li>실패 후에도 입력 내용 유지</li><li>같은 내용의 중복 데이터 미생성</li></ul></td>
            <td class="impact">높음</td>
          </tr>
          <tr>
            <td class="matrix-row-number">03</td>
            <td><strong>임시 저장 문서 이어쓰기</strong><span class="matrix-link">FRD-003 / 범위 3</span></td>
            <td><strong>임시 저장 문서함</strong><span class="matrix-link">wv-appr-draft-list</span></td>
            <td><ul class="matrix-detail-list"><li>본인의 임시 저장 문서 목록 조회</li><li>선택한 문서를 열어 작성 화면으로 이동</li><li>삭제한 문서를 목록에서 즉시 제거</li></ul></td>
            <td><ul class="matrix-detail-list"><li>작성자 본인 문서만 조회·수정</li><li>저장한 내용과 이어쓰기 내용이 일치</li></ul></td>
            <td class="impact">높음</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card matrix-card" aria-labelledby="screen-work-title">
    <header class="matrix-tools">
      <div><h2 id="screen-work-title">화면별 작업 상세</h2><p>화면 단위 변경과 관련 개발 범위를 대조합니다.</p></div>
      <span class="chip">2개</span>
    </header>
    <div class="proposal-table-wrap">
      <table class="matrix-screens">
        <thead><tr><th scope="col">시스템</th><th scope="col">화면</th><th scope="col">화면 ID</th><th scope="col">작업 내용</th><th scope="col">관련 범위</th><th scope="col">검증 포인트</th></tr></thead>
        <tbody>
          <tr><td>웹빌더</td><td><strong>결재 문서 작성</strong></td><td class="matrix-link">wv-appr-write</td><td><ul class="matrix-detail-list"><li>임시 저장 버튼 추가</li><li>마지막 자동 저장 시각 표시</li><li>저장 중 상태와 실패 안내 표시</li></ul></td><td>01 직접 저장<br>02 자동 저장</td><td>중복 클릭 차단<br>실패 후 입력값 유지</td></tr>
          <tr><td>웹빌더</td><td><strong>임시 저장 문서함</strong></td><td class="matrix-link">wv-appr-draft-list</td><td><ul class="matrix-detail-list"><li>임시 저장 문서 목록 제공</li><li>이어쓰기와 삭제 행동 제공</li><li>삭제 후 목록 즉시 갱신</li></ul></td><td>03 이어쓰기</td><td>본인 문서만 노출<br>삭제 결과 즉시 반영</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card matrix-card" aria-labelledby="backend-work-title">
    <header class="matrix-tools">
      <div><h2 id="backend-work-title">화면 외 구현 요건</h2><p>데이터 처리, 오류 복구, 접근 권한처럼 화면만으로 확인하기 어려운 작업입니다.</p></div>
      <span class="chip">3건</span>
    </header>
    <div class="proposal-table-wrap">
      <table class="matrix-backend">
        <thead><tr><th scope="col">구분</th><th scope="col">대상</th><th scope="col">구현 내용</th><th scope="col">관련 범위</th><th scope="col">확인 방법</th></tr></thead>
        <tbody>
          <tr><td><span class="chip">데이터 처리</span></td><td><strong>임시 저장</strong></td><td>직접 저장과 자동 저장이 같은 시점에 실행되면 한 번만 처리합니다.</td><td>01, 02</td><td>동시 요청에도 저장 데이터 1건 생성</td></tr>
          <tr><td><span class="chip">오류 처리</span></td><td><strong>저장 실패</strong></td><td>작성 내용을 유지하고 실패 이유와 다시 저장 행동을 안내합니다.</td><td>01, 02</td><td>오류 응답 후 입력값과 재시도 행동 확인</td></tr>
          <tr><td><span class="chip">권한</span></td><td><strong>문서 접근</strong></td><td>작성자 본인만 임시 저장 문서를 조회하고 수정할 수 있게 합니다.</td><td>03</td><td>다른 작성자의 조회·수정 요청 차단</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="matrix-support">
    <section class="card matrix-support__attention"><h3>확인 필요</h3><ul><li>기존 임시 저장 문서 보관 기간 확정</li><li>기간 만료 문서 처리 방식은 운영 정책 확인</li></ul></section>
    <section class="card matrix-support__done"><h3>완료 기준</h3><ul><li>직접·자동 저장 중복 실행 없음</li><li>저장 실패 시 작성 내용 유지</li><li>작성자 본인 문서만 조회·수정</li></ul></section>
    <section class="card matrix-support__boundary"><h3>범위 요약</h3><p>화면 2개, 데이터 처리 1건, 오류 처리 1건, 권한 1건을 변경합니다.</p></section>
  </div>

  <div class="matrix-boundary">
    <section class="card"><h3>운영 반영</h3><ul><li>기존 결재 작성 권한 정책을 그대로 적용합니다.</li><li>현재 결재 문서 작성 흐름은 유지합니다.</li></ul></section>
    <section class="card"><h3>이번 개발에서 제외</h3><ul><li>결재 완료 문서의 보관·파기 정책 변경</li><li>다른 사용자가 작성한 임시 저장 문서의 공유 기능</li></ul></section>
  </div>

  <section class="card matrix-delivery">
    <h3>개발팀 전달사항</h3>
    <p>배포 일정, 우선순위, 기존 데이터 확인 사항을 기록합니다. 현재 추가로 전달된 내용은 없습니다.</p>
    <button class="button primary" type="button">전달사항 입력</button>
  </section>
</template>
<script src="_shell.js"></script>
<script>시안('03','고밀도 영향도 표형')</script>
</body>
</html>
