<div class="frd-detail__grid"><div class="frd-detail__main"><section class="frd-panel" id="summary"><header class="frd-panel__head"><h2>기능 개요</h2><span class="badge badge--outline">필수</span></header><div class="frd-panel__body frd-field-stack"><label for="goal">사용자 목표<textarea class="frd-editor" id="goal">결재 문서 작성 중 자리를 비워도 입력 내용을 잃지 않고 나중에 이어서 작성한다.</textarea></label><label for="scope">기능 범위<textarea class="frd-editor" id="scope">작성 중인 제목, 본문, 결재선, 첨부파일 정보를 임시 저장한다. 저장한 문서는 임시 저장 문서함에서 다시 연다.</textarea></label></div></section><section class="frd-panel" id="rules"><header class="frd-panel__head"><h2>업무 규칙</h2><button class="button button--small" type="button">규칙 추가</button></header><ul class="frd-section-list"><li><strong>BR-01</strong><p>문서 제목이 없어도 임시 저장할 수 있다.</p></li><li><strong>BR-02</strong><p>결재 요청이 완료된 문서는 임시 저장 문서함에 남기지 않는다.</p></li><li><strong>BR-03</strong><p>사용자는 자신이 작성한 임시 저장 문서만 조회하고 수정할 수 있다.</p></li></ul></section><section class="frd-panel" id="acceptance"><header class="frd-panel__head"><h2>완료 기준</h2><button class="button button--small" type="button">기준 추가</button></header><ul class="frd-section-list"><li><strong>AC-01</strong><p>임시 저장을 누르면 입력한 내용이 저장되고 저장 완료 시각이 표시된다.</p></li><li><strong>AC-02</strong><p>문서함에서 임시 저장 문서를 열면 마지막으로 저장한 내용이 모두 표시된다.</p></li><li><strong>AC-03</strong><p>저장에 실패하면 이유와 다시 시도하는 방법을 안내한다.</p></li></ul></section></div>
