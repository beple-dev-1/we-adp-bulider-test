<body>
<template id="본문">
  <div class="dev-request-detail">
    <header class="rq-head dev-request-head">
      <div class="rq-head__copy"><span class="rq-kicker num">DR-003</span><h1>전자결재 임시 저장</h1><p>FRD 완료 시점에 확정한 개발 범위와 구현 정보를 확인합니다.</p></div>
      <div class="rq-head__actions"><span class="status-badge status-badge--progress">개발 진행 중</span><a class="button" href="#">개발요청서 다운로드</a></div>
    </header>

    <main class="dev-request-practical">
      <dl class="dev-request-meta-grid"><div><dt>시스템</dt><dd>웹빌더</dd></div><div><dt>적용 대상</dt><dd class="dev-request-meta-grid__facets"><span>통합</span></dd></div><div><dt>담당자</dt><dd>이영희</dd></div><div><dt>기준 FRD</dt><dd><a class="document-link num" href="05a-frd-workbench.html">FRD-003</a></dd></div><div><dt>생성 시각</dt><dd><time class="num" datetime="2026-08-12T16:30">2026-08-12 16:30</time></dd></div><div><dt>최종 수정</dt><dd><time class="num" datetime="2026-08-22T14:10">2026-08-22 14:10</time></dd></div></dl>

      <section class="dev-request-source" aria-labelledby="dev-source-title">
        <header class="dev-request-source__head"><div><span class="rq-kicker">요청 원문</span><h2 id="dev-source-title">요청 내용</h2></div><dl class="dev-request-source__stats"><div><dt>개발 범위</dt><dd>3건</dd></div><div><dt>작업 화면</dt><dd>2개</dd></div><div><dt>화면 외 구현</dt><dd>3건</dd></div></dl></header>
        <div class="dev-request-source__content"><section class="dev-request-source__section dev-request-source__section--summary" aria-labelledby="mock-interview-summary-title"><span>인터뷰 정리</span><h3 id="mock-interview-summary-title">요구사항 요약</h3><p>결재 문서 작성 중 직접 저장과 자동 저장을 지원하고, 저장한 문서를 문서함에서 다시 열어 이어서 작성할 수 있어야 합니다.</p></section><section class="dev-request-source__section" aria-labelledby="mock-original-request-title"><span>최초 입력</span><h3 id="mock-original-request-title">요청 원문</h3><p>전자결재 문서 작성 중 임시 저장 기능이 필요합니다. 작성 중인 결재 문서를 직접 저장하거나 일정 시간마다 자동으로 저장하고, 임시 저장 문서함에서 다시 열어 이어서 작성할 수 있어야 합니다.</p></section></div>
      </section>

      <div class="dev-request-primary">
        <section class="dev-request-panel" aria-labelledby="dev-scope-title"><header class="dev-request-panel__head"><div><h2 id="dev-scope-title">개발 범위</h2><p>개발이 필요한 항목입니다.</p></div><span>3건</span></header><ol class="dev-request-scope-list">
          <li><div><strong>결재 문서 직접 임시 저장</strong><p>사용자가 원하는 시점에 현재 작성 내용을 저장할 수 있어야 합니다.</p></div><span class="dev-request-nature">개발</span></li>
          <li><div><strong>작성 내용 자동 저장</strong><p>마지막 내용 변경 후 30초가 지나면 자동으로 저장해야 합니다.</p></div><span class="dev-request-nature">개발</span></li>
          <li><div><strong>임시 저장 문서 이어쓰기</strong><p>본인이 저장한 문서를 다시 열어 작성을 이어갈 수 있어야 합니다.</p></div><span class="dev-request-nature">개발</span></li>
        </ol></section>
      </div>

      <div class="dev-request-implementation">
        <section class="dev-request-panel dev-request-screen-panel" aria-labelledby="dev-screen-title"><header class="dev-request-panel__head"><div><h2 id="dev-screen-title">화면별 변경 내용</h2><p>FRD에서 확정한 화면별 작업 내용입니다.</p></div><span>2개</span></header><div class="table-wrap dev-request-table-wrap" tabindex="0" aria-label="화면별 변경 내용 표"><table class="data-table dev-request-detail-table dev-request-screen-table"><colgroup><col class="dev-request-screen-table__target"><col class="dev-request-screen-table__meta"><col></colgroup><thead><tr><th scope="col">대상 화면</th><th scope="col">화면 식별 정보</th><th scope="col">변경 내용</th></tr></thead><tbody>
          <tr><th scope="row" class="dev-request-screen-name"><span>웹빌더</span><div class="dev-request-screen-title"><strong>결재 문서 작성</strong><span class="dev-request-menu-notice" tabindex="0" role="img" aria-label="정식 메뉴 위치 안내" aria-describedby="menu-notice-sample">i</span><span class="dev-request-menu-notice__tip" id="menu-notice-sample" role="tooltip">정식 메뉴 위치가 연결되지 않았습니다. 개발요청 전송을 막지 않으며 관리자가 메뉴구조도에서 나중에 연결할 수 있습니다.</span></div></th><td class="dev-request-screen-meta"><span class="dev-request-code">화면 ID <b class="num">PS-BO-BIZ-020-D01-S</b></span></td><td><ul class="dev-request-list"><li>임시 저장 버튼과 마지막 자동 저장 시각을 표시합니다.</li><li>저장 중에는 저장 버튼을 비활성화합니다.</li></ul></td></tr>
          <tr><th scope="row" class="dev-request-screen-name"><span>웹빌더</span><div class="dev-request-screen-title"><strong>임시 저장 문서함</strong></div></th><td class="dev-request-screen-meta"><span class="dev-request-code">화면 ID <b class="num">PS-BO-BIZ-020-L01-S</b></span></td><td><ul class="dev-request-list"><li>임시 저장 문서 목록과 이어쓰기 기능을 제공합니다.</li><li>삭제한 문서는 목록에서 즉시 제거합니다.</li></ul></td></tr>
        </tbody></table></div></section>
        <section class="dev-request-panel" aria-labelledby="dev-backend-title"><header class="dev-request-panel__head"><div><h2 id="dev-backend-title">화면 외 구현</h2><p>API·데이터·권한 등의 변경 내용입니다.</p></div><span>3건</span></header><div class="table-wrap dev-request-table-wrap" tabindex="0" aria-label="화면 외 구현 표"><table class="data-table dev-request-detail-table dev-request-backend-table"><colgroup><col class="dev-request-backend-table__category"><col class="dev-request-backend-table__target"><col></colgroup><thead><tr><th scope="col">구분</th><th scope="col">구현 대상</th><th scope="col">변경 내용</th></tr></thead><tbody>
          <tr><td><span class="badge badge--info">데이터</span></td><th scope="row">임시 저장</th><td><p>직접 저장과 자동 저장이 겹치면 한 번만 처리합니다.</p></td></tr>
          <tr><td><span class="badge badge--info">기타</span></td><th scope="row">저장 실패</th><td><p>저장에 실패하면 작성 내용을 유지하고 실패 이유를 안내합니다.</p></td></tr>
          <tr><td><span class="badge badge--info">권한</span></td><th scope="row">문서 접근</th><td><p>작성자 본인만 임시 저장 문서를 조회하고 수정할 수 있습니다.</p></td></tr>
        </tbody></table></div></section>
      </div>

      <aside class="dev-request-review-stack">
        <section class="dev-request-review dev-request-review--issue" aria-labelledby="dev-open-issue-title"><h2 id="dev-open-issue-title">확인 필요 <span>1건</span></h2><ul><li><span class="dev-request-alert-mark">!</span><span>기존 임시 저장 문서의 보관 기간과 기간 만료 후 처리 방식을 확정해야 합니다.</span></li></ul></section>
        <section class="dev-request-review" aria-labelledby="dev-completion-title"><h2 id="dev-completion-title">완료 조건 <span>3건</span></h2><ol><li><span class="dev-request-check">✓</span><span>중복 데이터가 생성되지 않습니다.</span></li><li><span class="dev-request-check">✓</span><span>저장 실패 후에도 작성 내용이 유지됩니다.</span></li><li><span class="dev-request-check">✓</span><span>작성자 본인 문서만 조회하고 수정합니다.</span></li></ol></section>
      </aside>

      <section class="dev-request-boundary-grid" aria-labelledby="dev-boundary-title"><h2 id="dev-boundary-title" class="sr-only">운영 반영 및 범위 밖</h2><article><h3>운영 반영 <span>1건</span></h3><ul><li><strong>기존 문서 보관 기준 확인</strong><p>현재 운영 중인 보관 기준을 확인해 적용합니다.</p></li></ul></article><article><h3>범위 밖 <span>1건</span></h3><ul><li><strong>결재 완료 문서 보관 정책 변경</strong><p>이번 개발요청서의 개발 범위에 포함하지 않습니다.</p></li></ul></article></section>

    </main>
    <dialog class="dialog dialog--layer dev-delivery-dialog" id="dev-delivery-dialog" aria-modal="true" aria-labelledby="dev-delivery-title" aria-describedby="dev-delivery-description"><form class="dev-delivery-form"><header class="dialog__header"><div class="dialog__header-copy"><span class="dialog__kicker num">DR-003</span><h2 class="dialog__title" id="dev-delivery-title">개발요청</h2><p class="dialog__description" id="dev-delivery-description">개발팀에 함께 전달할 내용과 파일을 확인해 주세요.</p></div><button class="dialog__close" id="close-dev-delivery" type="button" aria-label="개발요청 레이어 닫기"></button></header><div class="dialog__body dev-delivery-dialog__body"><section class="dev-delivery-summary" aria-label="전송 대상"><span>전송 대상</span><strong>전자결재 임시 저장</strong><small><b>FRD-003</b> 기준으로 확정된 개발 범위를 전송합니다.</small></section><div class="dev-delivery-date-grid"><div class="field"><label class="field__label" for="development-completed-on">개발 완료일 <span>선택</span></label><input class="field__control" id="development-completed-on" type="date"><p class="field__help">개발 완료를 요청하는 날짜입니다.</p></div><div class="field"><label class="field__label" for="deployment-on">배포일 <span>선택</span></label><input class="field__control" id="deployment-on" type="date"><p class="field__help">운영 반영을 요청하는 날짜입니다.</p></div></div><div class="field"><label class="field__label" for="dev-comment">개발팀 전달사항 <span>선택</span></label><textarea class="field__control" id="dev-comment" rows="5" maxlength="4000" placeholder="일정, 우선순위, 개발 시 주의사항을 입력해 주세요."></textarea><p class="field__help">개발요청서 본문에 없는 추가 안내만 입력해 주세요.</p></div><div class="field"><label class="field__label" for="delivery-attachment">첨부파일 <span>선택</span></label><label class="dev-delivery-file" for="delivery-attachment"><strong>파일 선택</strong><span id="delivery-file-name">전달할 파일이 있으면 추가해 주세요.</span></label><input class="sr-only" id="delivery-attachment" type="file"><p class="field__help">파일 1개, 최대 20MB까지 첨부할 수 있습니다.</p></div></div><div class="dialog__actions"><p class="dialog__action-note">전송 후에는 개발팀의 접수 결과를 기다립니다.</p><button class="button" id="cancel-dev-delivery" type="button">취소</button><button class="button button--primary" type="submit">개발요청 보내기</button></div></form></dialog>
  </div>
</template>
<script src="_shell.js"></script>
<script>틀({제목:'개발요청서 상세',모양:'산출물',지금:'dev-requests',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});const 전송레이어=document.getElementById('dev-delivery-dialog');const 전송열기=document.getElementById('open-dev-delivery');전송열기?.addEventListener('click',()=>전송레이어.showModal());document.getElementById('close-dev-delivery').addEventListener('click',()=>전송레이어.close());document.getElementById('cancel-dev-delivery').addEventListener('click',()=>전송레이어.close());document.getElementById('delivery-attachment').addEventListener('change',event=>{document.getElementById('delivery-file-name').textContent=event.target.files[0]?.name||'전달할 파일이 있으면 추가해 주세요.';});if(location.hash==='#send'&&전송열기)전송레이어.showModal();document.querySelector('.dev-delivery-form').addEventListener('submit',event=>{event.preventDefault();event.submitter.textContent='요청 접수';event.submitter.disabled=true;});</script>
</body>
