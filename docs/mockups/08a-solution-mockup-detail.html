<script>틀({제목:'솔루션 목업 상세',모양:'산출물',지금:'solution-mockups',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});</script>
<script>
  const canvas = document.getElementById('preview-canvas');
  const zoomLevel = document.getElementById('zoom-level');
  const zoomOutButton = document.getElementById('zoom-out');
  const zoomInButton = document.getElementById('zoom-in');
  let zoom = 100;
  const updateZoom = nextZoom => {
    zoom = Math.min(150, Math.max(50, nextZoom));
    canvas.style.setProperty('--preview-zoom', zoom / 100);
    zoomLevel.value = `${zoom}%`;
    zoomLevel.textContent = `${zoom}%`;
    zoomOutButton.disabled = zoom === 50;
    zoomInButton.disabled = zoom === 150;
  };
  zoomOutButton.addEventListener('click', () => updateZoom(zoom - 10));
  zoomInButton.addEventListener('click', () => updateZoom(zoom + 10));
  document.getElementById('zoom-reset').addEventListener('click', () => updateZoom(100));
  const documentButton = document.getElementById('open-solution-document');
  const documentDialog = document.getElementById('solution-document-dialog');
  const closeDocument = () => {
    if (!documentDialog.open) return;
    documentDialog.close();
    documentButton.setAttribute('aria-expanded', 'false');
    documentButton.focus();
  };
  documentButton.addEventListener('click', () => {
    documentDialog.showModal();
    documentButton.setAttribute('aria-expanded', 'true');
  });
  documentDialog.querySelectorAll('[data-solution-document-close]').forEach(button => button.addEventListener('click', closeDocument));
  documentDialog.addEventListener('close', () => documentButton.setAttribute('aria-expanded', 'false'));
  const featureButton = document.getElementById('toggle-solution-features');
  const featureReview = document.getElementById('preview-review');
  const featurePanel = document.getElementById('solution-feature-panel');
  const featureList = document.getElementById('solution-feature-list');
  featureButton.addEventListener('click', () => {
    const active = featureButton.getAttribute('aria-pressed') !== 'true';
    featureButton.setAttribute('aria-pressed', String(active));
    featurePanel.hidden = !active;
    featureReview.classList.toggle('is-feature-open', active);
    featureList.replaceChildren();
    if (active) {
      document.querySelectorAll('#solution-feature-data > li').forEach(feature => {
        const item = document.createElement('li');
        item.className = 'preview-feature-item';
        item.dataset.state = 'missing';
        item.innerHTML = `<button class="preview-feature-item__button" type="button"><span class="preview-feature-item__top"><span class="preview-feature-item__no num"></span><span class="preview-feature-item__name"></span><span class="preview-feature-item__state">위치 없음</span></span><span class="preview-feature-item__detail"></span></button>`;
        item.querySelector('.preview-feature-item__no').textContent = feature.dataset.no;
        item.querySelector('.preview-feature-item__name').textContent = feature.dataset.label;
        item.querySelector('.preview-feature-item__detail').textContent = feature.dataset.detail;
        item.querySelector('button').addEventListener('click', () => {
          featureList.querySelectorAll('.preview-feature-item').forEach(row => row.classList.remove('is-selected'));
          item.classList.add('is-selected');
        });
        featureList.append(item);
      });
    }
  });
</script>
