<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/reset.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/typography.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/components.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/shell.css">
  <link rel="stylesheet" href="_mock.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/screens.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/design-guide.css">
</head>
<body>
<!-- 제품은 추출기가 준 계약(design-guide.json)을 Builder 화면에서 직접 그린다.
     남의 문서를 끼워 넣는 검수용 프레임 갈래는 004 에서 걷었고, DesignGuideScreenTest 가
     그것으로 되돌아가지 않는 것을 못 박는다. 목업도 같은 사실을 말해야 한다.
     담긴 자료는 2026-09-06 EXW 실측 모양이다 — 기본 스타일만 차 있고 나머지 셋은 빈 상태다. -->
<template id="본문">
  <section class="dg-native-page">
    <div class="page-head list-page-head">
      <div>
        <h1 class="page-head__title">디자인 가이드</h1>
        <p class="page-intro">시스템별 디자인 구성 요소와 스타일을 확인하고, 화면 작업에 사용할 기준을 관리합니다.</p>
      </div>
    </div>

    <div class="dg-native-guide">
      <div class="dg-native-toolbar">
        <div class="dg-native-context-row">
          <span class="dg-native-context-label" id="dg-system-label">시스템</span>
          <div class="dg-native-systems" role="tablist" aria-labelledby="dg-system-label">
            <button type="button" class="is-active" role="tab" aria-selected="true">외부제공 웹뷰</button>
          </div>
        </div>
        <div class="dg-native-facets">
          <label class="dg-native-facet--single">
            <span>적용 구분</span>
            <select><option>기본</option></select>
          </label>
        </div>
      </div>

      <section class="dg-native-system">
        <nav class="dg-native-tabs" aria-label="디자인 시스템 항목">
          <button type="button" class="is-active" data-guide-tab="foundations" aria-selected="true">기본 스타일</button>
          <button type="button" data-guide-tab="components" aria-selected="false">UI 컴포넌트</button>
          <button type="button" data-guide-tab="layouts" aria-selected="false">화면 레이아웃</button>
          <button type="button" data-guide-tab="templates" aria-selected="false">화면 템플릿</button>
        </nav>

        <section class="dg-native-panel" data-guide-panel="foundations">
          <div class="dg-native-section-head"><div><p>FOUNDATIONS</p><h2>기본 스타일</h2><span>시스템 전반에 일관되게 적용되는 시각 기준입니다.</span></div></div>
          <div class="dg-foundation-grid">
            <article class="dg-foundation-card dg-foundation-card--colors">
              <h3>색상</h3>
              <div class="dg-color-role">
                <strong>주색 토큰</strong>
                <div class="dg-color-role__values">
                  <span class="dg-color-swatch" style="--dg-swatch:#1F1F1F" title="#1F1F1F"><b>#1F1F1F</b></span>
                  <span class="dg-color-swatch" style="--dg-swatch:rgb(31,31,31,15%)" title="rgb(31,31,31,15%)"><b>rgb(31,31,31,15%)</b></span>
                </div>
              </div>
              <div class="dg-color-role">
                <strong>강조 토큰</strong>
                <div class="dg-color-role__values">
                  <span class="dg-color-swatch" style="--dg-swatch:#2F6BFF" title="#2F6BFF"><b>#2F6BFF</b></span>
                  <span class="dg-color-swatch" style="--dg-swatch:#F5F6F8" title="#F5F6F8"><b>#F5F6F8</b></span>
                </div>
              </div>
            </article>
            <article class="dg-foundation-card">
              <h3>타이포그래피</h3>
              <div class="dg-type-sample" style="font-family:'Pretendard', sans-serif;">
                <strong>Pretendard</strong>
                <p>화면을 이해하기 쉬운 문장</p><p lang="en">Design for better work 123</p>
                <span>사용 굵기 400 · 500 · 600 · 700 · 800</span>
              </div>
              <div class="dg-type-sample" style="font-family:'NanumSquare', sans-serif;">
                <strong>NanumSquare</strong>
                <p>화면을 이해하기 쉬운 문장</p><p lang="en">Design for better work 123</p>
                <span>사용 굵기 400 · 700 · 800</span>
              </div>
            </article>
            <article class="dg-foundation-card">
              <h3>간격</h3><div class="dg-measure-list"><span>0.4rem</span><span>0.8rem</span><span>1.2rem</span><span>1.6rem</span><span>2rem</span><span>2.4rem</span></div>
            </article>
            <article class="dg-foundation-card">
              <h3>Shape</h3>
              <div class="dg-radius-samples">
                <span><i style="border-radius:0.4rem"></i><b>0.4rem</b></span>
                <span><i style="border-radius:0.8rem"></i><b>0.8rem</b></span>
                <span><i style="border-radius:50%"></i><b>50%</b></span>
              </div>
            </article>
          </div>
        </section>

        <section class="dg-native-panel" data-guide-panel="components" hidden>
          <div class="dg-native-section-head"><div><p>COMPONENTS</p><h2>UI 컴포넌트</h2><span>여러 화면에서 독립적으로 다시 쓰는 기본 UI와 역할별 변형입니다.</span></div></div>
          <div class="dg-empty"><strong>확인된 컴포넌트가 없습니다.</strong></div>
        </section>

        <section class="dg-native-panel" data-guide-panel="layouts" hidden>
          <div class="dg-native-section-head"><div><p>LAYOUTS</p><h2>화면 레이아웃</h2><span>시스템 전체가 공유하는 골격과 영역 구성입니다.</span></div></div>
          <div class="dg-empty"><strong>공통 레이아웃이 등록되지 않았습니다.</strong><p>시스템 전체에 공통으로 적용되는 골격이 확인되면 이곳에 표시됩니다.</p></div>
        </section>

        <section class="dg-native-panel" data-guide-panel="templates" hidden>
          <div class="dg-native-section-head"><div><p>TEMPLATES</p><h2>화면 템플릿</h2><span>반복해서 쓰이는 업무 화면의 구성입니다.</span></div></div>
          <div class="dg-empty"><strong>등록된 화면 템플릿이 없습니다.</strong><p>반복 사용이 확인된 업무 화면 구성이 생기면 이곳에 표시됩니다.</p></div>
        </section>
      </section>
    </div>
  </section>
</template>
<script src="_shell.js"></script>
<script>틀({제목:'디자인가이드',모양:'산출물',지금:'design-guide',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});</script>
</body>
</html>
