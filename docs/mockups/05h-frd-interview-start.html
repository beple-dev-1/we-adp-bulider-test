<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css"><link rel="stylesheet" href="../../src/main/resources/static/css/reset.css"><link rel="stylesheet" href="../../src/main/resources/static/css/typography.css"><link rel="stylesheet" href="../../src/main/resources/static/css/components.css"><link rel="stylesheet" href="../../src/main/resources/static/css/shell.css"><link rel="stylesheet" href="_mock.css"><link rel="stylesheet" href="../../src/main/resources/static/css/screens.css"><link rel="stylesheet" href="_frd-interview.css"><title>FRD AI 인터뷰 시작</title></head>
<body><template id="본문"><main class="fi-page fi-page--setup">
  <header class="fi-head"><div class="fi-head__copy"><span class="rq-kicker">FRD 작업 만들기</span><h1>요구사항 분석 준비</h1><p>알고 있는 작업 조건과 화면을 먼저 선택하면 AI가 범위를 더 정확하게 판단합니다.</p></div><button class="button button--primary fi-setup-mobile-action" type="button">요구사항 분석 시작</button></header>
  <nav class="fi-steps" aria-label="FRD 작업 만들기 진행 단계"><div class="fi-step is-current" aria-current="step"><i>1</i><span>분석 정보 입력</span></div><div class="fi-step"><i>2</i><span>AI 인터뷰</span></div><div class="fi-step"><i>3</i><span>개발 범위 확인</span></div></nav>
  <form class="fi-setup-layout" action="#"><div class="fi-setup-main">
    <section class="fi-card fi-setup-section" aria-labelledby="setup-source-title"><header class="fi-setup-section__head"><div><h2 id="setup-source-title">요구사항</h2><p>구현할 내용을 업무 문장으로 입력해 주세요.</p></div><span class="badge badge--outline">직접 입력</span></header><div class="fi-setup-section__body"><fieldset class="fi-facet-picks"><legend>적용 대상</legend><label class="fi-check-pill is-selected"><input type="checkbox" checked><span>전체</span><small>모든 적용 대상</small></label><label class="fi-check-pill"><input type="checkbox"><span>제주</span><small class="num">jeju</small></label><label class="fi-check-pill"><input type="checkbox"><span>익산</span><small class="num">iksan</small></label></fieldset><label class="field" for="interview-source"><span class="field__label">요구사항 내용</span><textarea class="field__control fi-source fi-source--setup" id="interview-source" required>결재 상신 화면에서 작성 중인 문서를 임시 저장할 수 있어야 한다. 저장한 문서는 임시 저장 문서함에서 다시 열어 이어서 작성할 수 있어야 한다.</textarea></label></div></section>
    <section class="fi-card fi-setup-section" aria-labelledby="setup-screen-title"><header class="fi-setup-section__head"><div><h2 id="setup-screen-title">수정할 솔루션 목업</h2><p>선택한 화면을 AI가 먼저 확인합니다.</p></div></header><div class="fi-setup-section__body"><div class="fi-setup-screen-empty"><button class="fi-setup-screen-empty__icon" id="open-analysis-screen" type="button" aria-label="화면 추가" title="화면 추가">+</button><div><strong>선택한 화면이 없습니다</strong><p>기존 화면을 선택하거나 신규 화면 정보를 추가해 주세요.</p></div></div></div></section>
  </div><aside class="fi-setup-summary" aria-labelledby="setup-summary-title"><section class="fi-card"><header class="fi-card__head"><h2 id="setup-summary-title">AI 분석 기준</h2></header><div class="fi-card__body"><section class="fi-ai-criteria" aria-labelledby="ai-criteria-title"><header><h3 id="ai-criteria-title">AI가 확인할 기준</h3><p>입력한 요구사항과 작업 조건을 다음 기준으로 분석합니다.</p></header><ol><li><span>1</span><div><strong>기능 범위</strong><p>기존 기능 변경인지 신규 개발인지 확인</p></div></li><li><span>2</span><div><strong>화면 영향</strong><p>적용 대상별 차이와 영향받는 화면 확인</p></div></li><li><span>3</span><div><strong>연계 범위</strong><p>백엔드·데이터·외부 연계 변경 확인</p></div></li><li><span>4</span><div><strong>완료 기준</strong><p>정상 흐름·예외 상황·검증 조건 확인</p></div></li></ol></section></div><footer class="fi-setup-summary__actions"><p>분석 결과는 AI 인터뷰에서 확인한 뒤 확정합니다.</p><button class="button button--primary" type="button">요구사항 분석 시작</button></footer></section></aside></form>
  <dialog class="dialog dialog--layer fi-screen-dialog" id="analysis-screen-dialog" aria-labelledby="analysis-screen-title"><header class="dialog__header"><div class="dialog__header-copy"><h2 class="dialog__title" id="analysis-screen-title">화면 추가</h2><p class="dialog__description" id="screen-add-description">현재 운영 화면에서 수정할 화면을 선택해 주세요.</p></div><button class="dialog__close" id="close-analysis-screen" type="button" aria-label="화면 추가 레이어 닫기"></button></header><div class="dialog__body"><div class="fi-screen-add-tabs" role="tablist" aria-label="화면 추가 유형"><button class="fi-screen-add-tab is-active" id="existing-screen-tab" type="button" role="tab" aria-selected="true" aria-controls="existing-screen-panel" data-screen-add-mode="existing"><i>1</i><span><strong>기존 화면 추가</strong><small>솔루션 목업에서 수정할 화면을 찾습니다.</small></span></button><button class="fi-screen-add-tab" id="new-screen-tab" type="button" role="tab" aria-selected="false" aria-controls="new-screen-panel" data-screen-add-mode="new"><i>2</i><span><strong>신규 화면 개발</strong><small>기준 화면에서 새 화면을 만듭니다.</small></span></button></div><section class="fi-screen-add-panel" id="existing-screen-panel" role="tabpanel" aria-labelledby="existing-screen-tab"><header class="fi-screen-add-panel__head"><h3>솔루션 목업 선택</h3><p>제주에 적용되는 화면과 공통 화면만 보여줍니다.</p></header><div class="fi-existing-screen-tools"><label class="sr-only" for="existing-screen-system">시스템 선택</label><select class="field__control" id="existing-screen-system"><option value="">전체 시스템</option><option>webview</option><option>backoffice</option></select><label class="sr-only" for="existing-screen-search">화면 검색</label><input class="field__control" id="existing-screen-search" type="search" placeholder="화면명 또는 화면 ID 검색"></div><div class="fi-existing-screen-summary"><span>검색 결과 <b id="existing-screen-count">3</b>개</span><small>적용 대상: 제주 · 공통 화면 포함</small></div><ul class="fi-existing-screen-list" id="existing-screen-list"><li class="fi-existing-screen-item" data-screen-name="결재 문서 작성" data-screen-id="wv-approval-write" data-screen-system="webview"><div class="fi-existing-screen-thumb"><div class="fi-screen-thumbnail__sample" aria-hidden="true"><i></i><b></b><b></b><b></b></div><span>제주 화면</span></div><div class="fi-existing-screen-copy"><div><strong>결재 문서 작성</strong><span class="badge">제주</span></div><small class="num">wv-approval-write</small><p>제주와 익산 화면 구성이 다릅니다.</p></div><button class="button" type="button">화면 추가</button></li><li class="fi-existing-screen-item" data-screen-name="결재 문서함" data-screen-id="wv-approval-list" data-screen-system="webview"><div class="fi-existing-screen-thumb"><div class="fi-screen-thumbnail__sample" aria-hidden="true"><i></i><b></b><b></b><b></b></div><span>공통 화면</span></div><div class="fi-existing-screen-copy"><div><strong>결재 문서함</strong><span class="badge badge--outline">공통 화면</span></div><small class="num">wv-approval-list</small></div><button class="button" type="button">화면 추가</button></li><li class="fi-existing-screen-item" data-screen-name="임시 저장 문서함" data-screen-id="wv-approval-draft-list" data-screen-system="webview"><div class="fi-existing-screen-thumb"><div class="fi-screen-thumbnail__sample" aria-hidden="true"><i></i><b></b><b></b><b></b></div><span>제주 화면</span></div><div class="fi-existing-screen-copy"><div><strong>임시 저장 문서함</strong><span class="badge">제주</span></div><small class="num">wv-approval-draft-list</small></div><button class="button" type="button">화면 추가</button></li></ul><div class="fi-existing-screen-empty" id="existing-screen-empty" role="status" aria-live="polite" hidden><strong id="existing-screen-empty-title">검색 결과가 없습니다</strong><p id="existing-screen-empty-description">검색어나 시스템을 바꿔 다시 확인해 주세요.</p></div></section><section class="fi-screen-add-panel" id="new-screen-panel" role="tabpanel" aria-labelledby="new-screen-tab" hidden><header class="fi-screen-add-panel__head"><h3>신규 화면 정보</h3><p>구성이 가장 비슷한 솔루션 목업을 기준으로 선택해 주세요.</p></header><form class="fi-new-screen-form"><label class="field fi-new-screen-form__base" for="new-base-screen"><span class="field__label">기준 화면</span><select class="field__control" id="new-base-screen" required><option value="">기준 화면을 선택해 주세요</option><option>결재 문서함 · wv-approval-list</option><option>결재 문서 작성 · wv-approval-write</option></select></label><label class="field" for="new-screen-name"><span class="field__label">새 화면명</span><input class="field__control" id="new-screen-name" type="text" placeholder="예: 임시 저장 문서함" required></label><label class="field" for="new-screen-id"><span class="field__label">새 화면 ID</span><input class="field__control num" id="new-screen-id" type="text" placeholder="예: wv-approval-draft-list" required></label><div class="fi-new-screen-form__actions"><span class="badge">제주</span><button class="button button--primary" type="button">신규 화면 추가</button></div></form></section></div></dialog>
</main></template><script src="_shell.js"></script><script>틀({제목:'FRD 작업 만들기',모양:'산출물',지금:'frds',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});const d=document.getElementById('analysis-screen-dialog');const tabs=[...document.querySelectorAll('[data-screen-add-mode]')];const panels={existing:document.getElementById('existing-screen-panel'),new:document.getElementById('new-screen-panel')};const description=document.getElementById('screen-add-description');const search=document.getElementById('existing-screen-search');const system=document.getElementById('existing-screen-system');const items=[...document.querySelectorAll('.fi-existing-screen-item')];const count=document.getElementById('existing-screen-count');const list=document.getElementById('existing-screen-list');const empty=document.getElementById('existing-screen-empty');function screenMode(mode){tabs.forEach(tab=>{const active=tab.dataset.screenAddMode===mode;tab.classList.toggle('is-active',active);tab.setAttribute('aria-selected',String(active));});Object.entries(panels).forEach(([key,panel])=>panel.hidden=key!==mode);description.textContent=mode==='new'?'기준 화면을 바탕으로 개발할 새 화면 정보를 입력해 주세요.':'현재 운영 화면에서 수정할 화면을 선택해 주세요.';}function filterScreens(){const keyword=search.value.trim().toLowerCase();const selectedSystem=system.value;let visible=0;items.forEach(item=>{const matchesKeyword=!keyword||item.dataset.screenName.toLowerCase().includes(keyword)||item.dataset.screenId.includes(keyword);const matchesSystem=!selectedSystem||item.dataset.screenSystem===selectedSystem;item.hidden=!(matchesKeyword&&matchesSystem);if(!item.hidden)visible++;});count.textContent=String(visible);list.hidden=visible===0;empty.hidden=visible!==0;}search.addEventListener('input',filterScreens);system.addEventListener('change',filterScreens);tabs.forEach(tab=>tab.addEventListener('click',()=>screenMode(tab.dataset.screenAddMode)));document.getElementById('open-analysis-screen').addEventListener('click',()=>d.showModal());document.getElementById('close-analysis-screen').addEventListener('click',()=>d.close());if(location.hash==='#empty')search.value='없는 화면';screenMode(location.hash==='#new'?'new':'existing');filterScreens();if(location.hash==='#existing'||location.hash==='#new'||location.hash==='#empty')d.showModal();</script></body></html>
