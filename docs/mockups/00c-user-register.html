<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css"><link rel="stylesheet" href="../../src/main/resources/static/css/reset.css"><link rel="stylesheet" href="../../src/main/resources/static/css/typography.css"><link rel="stylesheet" href="../../src/main/resources/static/css/components.css"><link rel="stylesheet" href="../../src/main/resources/static/css/shell.css"><link rel="stylesheet" href="_mock.css"><link rel="stylesheet" href="../../src/main/resources/static/css/screens.css">
  <title>사용자 등록</title>
</head>
<body><template id="본문">
  <div class="page-head document-page-head document-register-head">
    <div><h1 class="page-head__title">새 사용자 등록</h1></div>
    <div class="document-register-head__actions"><a class="button" href="00b-user-management.html">취소</a><button class="button button--primary" type="submit" form="user-register-form" data-submit-loading="사용자 등록 중">사용자 등록</button></div>
  </div>

  <form class="admin-form-card" id="user-register-form" method="post" onsubmit="return false">
    <section aria-labelledby="user-info-title">
      <h2 id="user-info-title">사용자 정보</h2>
      <div class="admin-field-grid"><div class="field"><label class="field__label" for="login-id">로그인 아이디</label><input class="field__control" id="login-id" name="loginId" autocomplete="username" maxlength="64" required></div><div class="field"><label class="field__label" for="user-name">이름</label><input class="field__control" id="user-name" name="name" autocomplete="name" maxlength="64" required></div></div>
      <div class="admin-field-grid"><div class="field"><label class="field__label" for="user-email">이메일</label><input class="field__control" id="user-email" name="email" type="email" autocomplete="email" maxlength="255" required aria-describedby="user-email-help"><p class="field__help" id="user-email-help">사용자 관리 화면에서 계정을 구분할 때 사용합니다.</p></div><div class="field"><label class="field__label" for="account-role">권한</label><select class="field__control" id="account-role" name="role" required aria-describedby="account-role-help"><option value="PLANNER" selected>기획자</option><option value="SUPER">슈퍼관리자</option></select><p class="field__help" id="account-role-help">슈퍼관리자는 프로젝트와 사용자를 관리할 수 있습니다.</p></div></div>
    </section>
    <section aria-labelledby="temporary-password-title">
      <h2 id="temporary-password-title">최초 로그인 정보</h2>
      <div class="field"><label class="field__label" for="temporary-password">임시 비밀번호</label><input class="field__control" id="temporary-password" name="temporaryPassword" type="password" autocomplete="new-password" minlength="8" required aria-describedby="temporary-password-help"><p class="field__help" id="temporary-password-help">8자 이상 입력해 주세요. 사용자는 최초 로그인 시 본인 비밀번호로 변경합니다.</p></div>
    </section>
  </form>
</template><script src="_shell.js"></script><script>틀({제목:'사용자 등록',모양:'관리',지금:'accounts',사람:'슈퍼관리자',슈퍼계정:true,안읽은알림:0});</script></body>
</html>
