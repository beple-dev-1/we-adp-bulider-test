<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="_auth-concepts.css"></head>
<body class="auth auth--setup">
<main class="setup-card">
  <header><a class="auth-brand" href="login-a.html">WE-ADP <span>Builder</span></a><div class="setup-step" aria-label="최초 설정 진행 단계"><span aria-current="step">1</span><i></i><span>2</span></div></header>
  <div class="setup-intro"><p>최초 로그인 · 1단계</p><h1>새 비밀번호 설정</h1><span>임시 비밀번호 대신 앞으로 사용할 본인 비밀번호를 설정합니다.</span></div>
  <form id="first-password-form" action="11b-claude-connect.html" novalidate>
    <label for="setup-password">새 비밀번호</label>
    <input id="setup-password" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="password-help password-error">
    <p class="field-note" id="password-help">8자 이상이며 임시 비밀번호와 다르게 입력하세요.</p>
    <p class="auth-field-error" id="password-error" role="alert" hidden></p>
    <label for="setup-confirm">새 비밀번호 확인</label>
    <input id="setup-confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="confirm-error">
    <p class="auth-field-error" id="confirm-error" role="alert" hidden></p>
    <button type="submit" data-submit-loading="비밀번호 설정 중">비밀번호 설정 후 계속</button>
  </form>
  <p class="auth-help">보안을 위해 임시 비밀번호는 다시 사용할 수 없습니다.</p>
</main>
<script>
const form = document.getElementById('first-password-form');
const password = document.getElementById('setup-password');
const confirmPassword = document.getElementById('setup-confirm');
const passwordError = document.getElementById('password-error');
const confirmError = document.getElementById('confirm-error');

function showError(input, error, message) {
  input.setAttribute('aria-invalid', 'true');
  error.textContent = message;
  error.hidden = false;
}

function clearError(input, error) {
  input.removeAttribute('aria-invalid');
  error.textContent = '';
  error.hidden = true;
}

password.addEventListener('input', () => clearError(password, passwordError));
confirmPassword.addEventListener('input', () => clearError(confirmPassword, confirmError));

form.addEventListener('submit', event => {
  event.preventDefault();
  clearError(password, passwordError);
  clearError(confirmPassword, confirmError);

  if (!password.value) {
    showError(password, passwordError, '새 비밀번호를 입력해 주세요.');
    password.focus();
    return;
  }
  if (password.value.length < 8) {
    showError(password, passwordError, '비밀번호는 8자 이상 입력해 주세요.');
    password.focus();
    return;
  }
  if (!confirmPassword.value) {
    showError(confirmPassword, confirmError, '새 비밀번호를 한 번 더 입력해 주세요.');
    confirmPassword.focus();
    return;
  }
  if (password.value !== confirmPassword.value) {
    showError(confirmPassword, confirmError, '입력한 비밀번호가 서로 다릅니다.');
    confirmPassword.focus();
    return;
  }
  const submitButton = form.querySelector('[data-submit-loading]');
  submitButton.classList.add('is-submit-loading');
  submitButton.setAttribute('aria-label', submitButton.dataset.submitLoading);
  submitButton.disabled = true;
  form.setAttribute('aria-busy', 'true');
  setTimeout(() => {
    window.location.href = form.action;
  }, 600);
});
</script>
</body>
</html>
