<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>설정된 프로젝트 없음 · WE-ADP Builder</title>
  <link rel="stylesheet" href="_auth-concepts.css">
</head>
<body class="auth auth--setup">
<main class="setup-card setup-card--wide">
  <header>
    <a class="auth-brand" href="login-a.html">WE-ADP <span>Builder</span></a>
    <span class="project-empty-user">이영희 기획자</span>
  </header>

  <div class="setup-intro">
    <p>로그인 완료</p>
    <h1 id="project-empty-title">설정된 프로젝트가 없습니다</h1>
    <span>현재 계정으로 열 수 있는 프로젝트가 없어 Builder 업무 화면으로 이동할 수 없습니다.</span>
  </div>

  <section class="project-empty-state" role="status" aria-labelledby="project-empty-title">
    <span class="project-empty-state__icon" aria-hidden="true">!</span>
    <div>
      <strong>관리자에게 프로젝트 설정을 요청해 주세요.</strong>
      <p>프로젝트 설정이 완료된 뒤 다시 로그인하면 작업을 시작할 수 있습니다.</p>
    </div>
  </section>

  <a class="secondary-action project-empty-action" href="login-a.html">로그인 화면으로 돌아가기</a>
</main>
</body>
</html>
