          <p class="wiki-canvas__lead">G2C 사업에서 신청, 승인, 지급 업무에 공통으로 적용할 정책을 정합니다.</p>
          <hr>
          <section id="wiki-purpose"><h2>1. 목적</h2><p>이 문서는 G2C 사업의 신청, 승인, 지급 과정에서 일관되게 적용할 정책을 정합니다.</p></section>
          <section id="wiki-scope"><h2>2. 적용 범위</h2><p>지원사업 신청자, 검토 담당자, 승인 담당자와 지급 담당자가 사용하는 모든 화면과 문서에 적용합니다.</p></section>
          <section id="wiki-application"><h2>3. 신청 정책</h2><h3>3.1 신청 자격</h3><p>사업자등록 상태가 정상이고 공고일 기준 지원 대상 업종에 해당하는 사업자만 신청할 수 있습니다.</p><h3>3.2 중복 신청</h3><p>같은 사업자번호로 동일 사업에 두 번 신청할 수 없습니다.</p></section>
          <section id="wiki-approval"><h2>4. 승인 정책</h2><p>필수 증빙이 모두 확인된 신청만 최종 승인할 수 있습니다.</p></section>
          <section id="wiki-payment"><h2>5. 지급 정책</h2><p>지원금은 신청 마감 다음 달 10일에 지급합니다. 지급일이 휴일이면 다음 영업일에 지급합니다.</p><h3>5.1 지급 제한</h3><p>승인 후 사업자 상태가 휴·폐업으로 바뀌면 지급을 보류하고 담당자가 다시 확인합니다.</p></section>
          <section id="wiki-exception"><h2>6. 예외 처리</h2><p>정책에 적히지 않은 예외는 사업 책임자의 판단을 받은 뒤 정책서에 반영합니다.</p></section>
