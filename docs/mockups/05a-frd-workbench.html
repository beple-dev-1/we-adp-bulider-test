        </article>
      </div></div>
    </section>
  </dialog>
  <dialog class="dialog" id="add-work-screen-dialog" aria-labelledby="add-work-screen-title"><form method="dialog"><div class="dialog__body"><h2 id="add-work-screen-title">FRD 화면 추가</h2><p>솔루션 목업에서 이 FRD 작업에 추가할 화면을 선택합니다.</p><div class="field"><label class="field__label" for="work-screen-candidate">추가할 화면</label><select class="field__control" id="work-screen-candidate" required><option value="">화면을 선택하세요</option><option value="wv-appr-attach|결재 문서 첨부파일">wv-appr-attach · 결재 문서 첨부파일</option><option value="wv-appr-line-select|결재선 선택">wv-appr-line-select · 결재선 선택</option><option value="wv-appr-result|결재 요청 완료">wv-appr-result · 결재 요청 완료</option></select></div></div><div class="dialog__actions"><button class="button" type="submit" value="cancel">취소</button><button class="button button--primary" id="confirm-add-work-screen" type="submit" value="add">화면 추가</button></div></form></dialog>
</template>
<script src="_shell.js"></script>
<script>틀({제목:'FRD 작업 상세',모양:'산출물',지금:'frds',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});</script>
<script src="_claude-window.js"></script>
<script src="_frd-concepts.js"></script>
<script>
  const mockupScreen = document.querySelector('.wm-product');
  const selectAreaButton = document.getElementById('select-mockup-area');
  const selectionContext = document.getElementById('mockup-selection-context');
  const selectionLabel = document.getElementById('mockup-selection-label');
  const messageInput = document.getElementById('work-mockup-claude-message');
  const canvasSheet = document.getElementById('mockup-canvas-sheet');
  const zoomLevel = document.getElementById('zoom-level');
  const zoomOutButton = document.getElementById('zoom-out');
  const zoomInButton = document.getElementById('zoom-in');
  let zoom = 100;
  let selectedElement = null;

  const updateZoom = nextZoom => {
    zoom = Math.min(150, Math.max(50, nextZoom));
    canvasSheet.style.setProperty('--mockup-zoom', zoom / 100);
    zoomLevel.value = `${zoom}%`;
    zoomLevel.textContent = `${zoom}%`;
    zoomOutButton.disabled = zoom === 50;
    zoomInButton.disabled = zoom === 150;
  };
  zoomOutButton.addEventListener('click', () => updateZoom(zoom - 10));
  zoomInButton.addEventListener('click', () => updateZoom(zoom + 10));
  document.getElementById('zoom-reset').addEventListener('click', () => updateZoom(100));

  const focusButton = document.getElementById('toggle-frd-focus');
  const setFocusMode = active => {
    document.body.classList.toggle('is-frd-focus', active);
    focusButton.setAttribute('aria-pressed', String(active));
    focusButton.setAttribute('aria-label', active ? '작업 화면 원래 크기로' : '작업 화면 확대');
    focusButton.title = active ? '작업 화면 원래 크기로 (Esc)' : '작업 화면 확대';
  };
  const navToggle = document.querySelector('[data-nav-toggle]');
  navToggle?.addEventListener('click', event => {
    if (!document.body.classList.contains('is-frd-focus')) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    setFocusMode(false);
    document.body.classList.remove('is-nav-collapsed');
    navToggle.setAttribute('aria-expanded', 'true');
    navToggle.setAttribute('aria-label', '메뉴 접기');
    navToggle.title = '메뉴 접기';
    try { window.localStorage.setItem('builder-nav-collapsed', 'false'); } catch (error) { /* 현재 화면만 펼친다. */ }
  }, true);
  focusButton.addEventListener('click', () => setFocusMode(!document.body.classList.contains('is-frd-focus')));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && document.body.classList.contains('is-frd-focus')) {
      setFocusMode(false);
      focusButton.focus();
    }
  });

  const clearSelection = () => {
    selectedElement?.classList.remove('is-selected');
    selectedElement = null;
    selectionContext.hidden = true;
    selectionLabel.textContent = '';
  };
  selectAreaButton.addEventListener('click', () => {
    const active = !mockupScreen.classList.contains('is-selecting');
    mockupScreen.classList.toggle('is-selecting', active);
    selectAreaButton.setAttribute('aria-pressed', String(active));
    selectAreaButton.textContent = active ? '선택 종료' : '수정 영역 선택';
  });
  mockupScreen.addEventListener('click', event => {
    if (!mockupScreen.classList.contains('is-selecting')) return;
    const target = event.target.closest('[data-mockup-id]');
    if (!target) return;
    event.preventDefault();
    selectedElement?.classList.remove('is-selected');
    selectedElement = target;
    target.classList.add('is-selected');
    selectionLabel.textContent = target.dataset.mockupLabel;
    selectionContext.hidden = false;
    mockupScreen.classList.remove('is-selecting');
    selectAreaButton.setAttribute('aria-pressed', 'false');
    selectAreaButton.textContent = '수정 영역 선택';
    document.querySelector('.claude-fab').click();
  });
  document.getElementById('clear-mockup-selection').addEventListener('click', clearSelection);
  const documentDialog = document.getElementById('frd-document-dialog');
  const memoDialog = document.getElementById('screen-memo-dialog');
  const historyDialog = document.getElementById('screen-history-dialog');
  document.getElementById('open-frd-document').addEventListener('click', () => {
    document.querySelector('.wm-screen-document__content').scrollTop = 0;
    documentDialog.showModal();
  });
  document.getElementById('close-frd-document').addEventListener('click', () => documentDialog.close());
  document.querySelector('.wm-screen-document__toc').addEventListener('click', event => {
    const button = event.target.closest('[data-document-target]');
    if (!button) return;
    const target = document.getElementById(button.dataset.documentTarget);
    if (!target) return;
    document.querySelectorAll('.wm-screen-document__toc button').forEach(item => item.removeAttribute('aria-current'));
    button.setAttribute('aria-current', 'true');
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('open-screen-memo').addEventListener('click', () => memoDialog.showModal());
  document.getElementById('close-screen-memo').addEventListener('click', () => memoDialog.close());
  document.getElementById('open-screen-history').addEventListener('click', () => historyDialog.showModal());
  document.getElementById('close-screen-history').addEventListener('click', () => historyDialog.close());
  const layerPreview = new URLSearchParams(window.location.search).get('layer');
  ({ document: documentDialog, memo: memoDialog, history: historyDialog,
    overview: document.getElementById('frd-overview-dialog') })[layerPreview]?.showModal();
  const markerDialog = document.getElementById('mockup-marker-dialog');
  document.getElementById('add-mockup-marker').addEventListener('click', () => markerDialog.showModal());
  document.querySelector('.wm-marker').addEventListener('click', event => { event.stopPropagation(); markerDialog.showModal(); });
  markerDialog.addEventListener('close', () => {
    if (markerDialog.returnValue !== 'use-ai') return;
    selectionLabel.textContent = `화면 설명 · ${document.getElementById('mockup-marker-description').value.trim()}`;
    selectionContext.hidden = false;
    messageInput.focus();
    if (document.querySelector('.claude-overlay').hidden) document.querySelector('.claude-fab').click();
  });
  document.getElementById('save-work-mockup').addEventListener('click', event => { event.currentTarget.textContent = '저장 완료'; event.currentTarget.disabled = true; });
  const addScreenDialog = document.getElementById('add-work-screen-dialog');
  const screenCandidate = document.getElementById('work-screen-candidate');
  document.getElementById('add-work-screen').addEventListener('click', () => addScreenDialog.showModal());
  const frdOverviewDialog = document.getElementById('frd-overview-dialog');
  const frdOverviewButton = document.getElementById('open-frd-overview');
  const frdRequirementButton = document.getElementById('open-frd-requirement');
  const frdOverviewToc = frdOverviewDialog.querySelector('.wm-frd-overview__toc');
  const frdOverviewContent = document.getElementById('frd-overview-content');
  let frdOverviewReturnFocus = frdOverviewButton;
  const openFrdOverview = (targetId, opener) => {
    frdOverviewReturnFocus = opener;
    const target = document.getElementById(targetId);
    frdOverviewToc.querySelectorAll('button').forEach(item => item.toggleAttribute('aria-current', item.dataset.frdOverviewTarget === targetId));
    frdOverviewDialog.showModal();
    opener.setAttribute('aria-expanded', 'true');
    if (targetId === 'frd-overview-summary-title') frdOverviewContent.scrollTop = 0;
    else target.scrollIntoView({ block: 'start' });
  };
  frdOverviewButton.addEventListener('click', () => openFrdOverview('frd-overview-summary-title', frdOverviewButton));
  frdRequirementButton.addEventListener('click', () => openFrdOverview('frd-overview-requirement-title', frdRequirementButton));
  document.getElementById('close-frd-overview').addEventListener('click', () => {
    frdOverviewDialog.close();
    frdOverviewButton.setAttribute('aria-expanded', 'false');
    frdRequirementButton.setAttribute('aria-expanded', 'false');
    frdOverviewReturnFocus.focus();
  });
  frdOverviewToc.addEventListener('click', event => {
    const button = event.target.closest('[data-frd-overview-target]');
    if (!button) return;
    const target = document.getElementById(button.dataset.frdOverviewTarget);
    if (!target) return;
    frdOverviewToc.querySelectorAll('button').forEach(item => item.removeAttribute('aria-current'));
    button.setAttribute('aria-current', 'true');
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('confirm-add-work-screen').addEventListener('click', event => {
    if (!screenCandidate.reportValidity()) { event.preventDefault(); return; }
    const [screenId, screenName] = screenCandidate.value.split('|');
    const link = document.createElement('a');
    link.href = '#screen-preview';
    link.innerHTML = `<span><small class="num">${screenId}</small><strong>${screenName}</strong></span><span class="status-badge status-badge--waiting">AI 초안 대기</span>`;
    document.getElementById('work-screen-list').append(link);
    screenCandidate.querySelector(`option[value="${screenCandidate.value}"]`).disabled = true;
    screenCandidate.value = '';
  });
  // ⛔ Claude 대화창은 이번 판에 잠근다 — _frd-concepts.js 가 만든 트리거를 여기서 비활성화한다.
  const claudeTrigger = document.querySelector('.claude-fab');
  if (claudeTrigger) {
    claudeTrigger.disabled = true;
    claudeTrigger.setAttribute('title', '다음 판입니다');
  }
</script>
</body>
</html>
