<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기능명세서 생성 중 시안</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/reset.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/typography.css">
  <link rel="stylesheet" href="_artifact-generation-standard.css">
</head>
<body>
<main class="generation-stage">
  <section class="generation-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <header class="generation-dialog__head">
      <p class="generation-dialog__kind">기능명세서</p>
      <h1 id="dialog-title">지출결의 작성</h1>
      <p class="generation-dialog__meta">업무관리 시스템 · PS-BO-EXP-010-W01-S</p>
      <button class="generation-dialog__close" type="button" aria-label="기능명세서 닫기"></button>
    </header>
    <div class="generation-dialog__body">
      <section class="generation-status" aria-live="polite">
        <p class="generation-status__label"><span class="generation-status__dot" aria-hidden="true"></span>산출물 준비 중</p>
        <h2>기능명세서를 작성하고 있습니다</h2>
        <p class="generation-status__description">화면 자료와 IA를 확인해 제출용 문서로 정리하고 있습니다.</p>
        <div class="generation-status__track" aria-hidden="true"></div>
        <p class="generation-status__note">완료되면 이 레이어가 자동으로 갱신됩니다.</p>
      </section>
      <div class="generation-paper" aria-hidden="true">
        <div class="generation-paper__head">
          <i class="generation-paper__line generation-paper__line--kind"></i>
          <i class="generation-paper__line generation-paper__line--title"></i>
          <div class="generation-paper__meta"><div><i></i><i></i></div><div><i></i><i></i></div><div><i></i><i></i></div><div><i></i><i></i></div></div>
        </div>
        <div class="generation-paper__section"><i class="generation-paper__section-title"></i><i class="generation-paper__section-rule"></i><i class="generation-paper__section-line"></i><i class="generation-paper__section-line generation-paper__section-line--medium"></i></div>
        <div class="generation-paper__section"><i class="generation-paper__section-title"></i><i class="generation-paper__section-rule"></i><i class="generation-paper__section-line"></i><i class="generation-paper__section-line generation-paper__section-line--short"></i></div>
      </div>
    </div>
    <footer class="generation-dialog__foot"><button type="button">닫기</button></footer>
  </section>
</main>
</body>
</html>
