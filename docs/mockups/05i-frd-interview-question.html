<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/reset.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/typography.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/components.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/shell.css">
  <link rel="stylesheet" href="_mock.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/screens.css">
  <link rel="stylesheet" href="_frd-interview.css">
  <title>FRD 요구사항 분석 결과 검토</title>
</head>
<body>
<template id="본문">
  <main class="fi-page">
    <header class="fi-head">
      <div class="fi-head__copy">
        <span class="rq-kicker num">FRD-011</span>
        <h1>고유가 피해지원금 종료처리</h1>
      </div>
    </header>

    <nav class="fi-steps" aria-label="FRD 작업 만들기 진행 단계">
      <div class="fi-step is-done"><i>✓</i><span>요구사항 입력</span></div>
      <div class="fi-step is-current" aria-current="step"><i>2</i><span>AI 인터뷰</span></div>
      <div class="fi-step"><i>3</i><span>분석 결과 확인</span></div>
      <div class="fi-step"><i>4</i><span>FRD 작업 열기</span></div>
    </nav>

    <div class="fi-layout fi-layout--interview">
      <section class="fi-card fi-chat fi-chat--interview fi-main" aria-labelledby="interview-title">
        <header class="fi-card__head fi-conversation-head">
          <div class="fi-interview-brand">
            <img src="claudecode-color.png" width="32" height="32" alt="">
            <h2 id="interview-title">Claude Code</h2>
          </div>
          <span class="fi-session-state is-waiting" id="session-state"><i></i><span>분석 결과 검토</span></span>
        </header>

        <div class="fi-chat__log" id="interview-log" aria-live="polite">
          <article class="fi-message fi-message--user">
            <div class="fi-message__who"><strong>이영희</strong><span>09:38</span></div>
            <div class="fi-message__bubble">
              <p>고유가 피해지원금 종료에 맞춰 전체 메뉴와 가맹점 찾기 안내를 정리하고, FAQ 삭제와 공지사항 게시도 확인해 주세요.</p>
            </div>
          </article>

          <section class="fi-turn-work fi-turn-work--complete" aria-label="실행 내용">
            <div class="fi-turn-work__head">
              <span class="fi-turn-work__state"><i>✓</i><strong>요구사항과 관련 화면 조사를 마쳤습니다</strong></span>
            </div>
            <ol class="fi-tool-calls">
              <li class="is-done"><i>✓</i><div><strong>관련 화면 확인</strong><span>전체 메뉴 · 가맹점 찾기 · FAQ · 공지사항</span></div></li>
              <li class="is-done"><i>✓</i><div><strong>프론트 변경 범위 확인</strong><span class="num">wv-merc-search-main · wv-modal-merc-filter</span></div></li>
              <li class="is-done"><i>✓</i><div><strong>백엔드 변경 범위 확인</strong><span>동적 설정 데이터 · 결제 가능 상품권 안내 데이터</span></div></li>
            </ol>
          </section>

          <article class="fi-message fi-question fi-question--answered">
            <div class="fi-message__bubble">
              <p class="fi-question__title">가맹점 찾기의 결제 가능 상품권 안내는 어느 화면의 문구를 변경하면 될까요?</p>
              <div class="fi-question__reason">
                <strong>질문한 이유</strong>
                <span>저장소에서 첫 화면 안내와 상세조회 필터가 모두 확인되어 수정 위치를 확정해야 했습니다.</span>
              </div>
              <div class="fi-options" role="radiogroup" aria-label="안내 문구 위치">
                <label class="fi-option"><input type="radio" name="notice-scope" disabled><span>가맹점 찾기 첫 화면만 변경</span></label>
                <label class="fi-option"><input type="radio" name="notice-scope" checked disabled><span>첫 화면과 상세조회 필터 모두 변경</span></label>
                <label class="fi-option"><input type="radio" name="notice-scope" disabled><span>상세조회 필터만 변경</span></label>
                <label class="fi-option"><input type="radio" name="notice-scope" disabled><span>직접 입력</span></label>
              </div>
              <div class="fi-question-submit fi-question-submit--done">
                <span>선택한 답변이 분석에 반영되었습니다.</span>
                <button class="button" type="button" disabled>답변 제출 완료</button>
              </div>
            </div>
          </article>

          <article class="fi-message fi-change-report" id="analysis-result">
            <div class="fi-message__bubble">
              <div class="fi-change-report__intro"><h2>수정이 필요한 범위만 정리했습니다.</h2></div>
              <div class="fi-change-columns">
                <section class="fi-change-group fi-change-group--front" aria-labelledby="front-change-title">
                  <header><span>FRONTEND</span><h3 id="front-change-title">수정할 프론트</h3><strong>2개 화면</strong></header>
                  <ul>
                    <li><div><strong>가맹점 찾기</strong><small class="num">wv-merc-search-main</small></div><p>결제 가능 상품권 안내 문구를 종료 전 상태로 변경합니다.</p></li>
                    <li><div><strong>가맹점 상세조회 필터</strong><small class="num">wv-modal-merc-filter</small></div><p>결제 가능 상품권 필터에서 고유가 피해지원금 항목을 제외합니다.</p></li>
                  </ul>
                </section>
                <section class="fi-change-group fi-change-group--back" aria-labelledby="back-change-title">
                  <header><span>BACKEND</span><h3 id="back-change-title">수정할 백엔드</h3><strong>2개 항목</strong></header>
                  <ul>
                    <li><div><span class="badge badge--outline">데이터</span><strong>웹뷰 동적 설정</strong></div><p>전체 메뉴에서 고유가 피해지원금 항목이 노출되지 않도록 메뉴 노출 값을 변경합니다.</p></li>
                    <li><div><span class="badge badge--outline">데이터</span><strong>결제 가능 상품권 안내</strong></div><p>가맹점 찾기에 제공하는 안내 문구와 필터 데이터를 종료 상태로 변경합니다.</p></li>
                  </ul>
                </section>
              </div>
              <section class="fi-approval" aria-labelledby="approval-with-changes-title">
                <h3 class="sr-only" id="approval-with-changes-title">분석 결과 처리</h3>
                <div class="fi-decision-actions"><button class="button button--primary js-apply-analysis" type="button">분석 결과 승인</button><button class="button js-continue-chat" type="button">더 대화하기</button></div>
              </section>
            </div>
          </article>
          <article class="fi-message fi-change-report fi-no-change-scenario">
            <div class="fi-message__bubble">
              <div class="fi-change-report__intro"><h2>요구사항에 해당하는 수정 작업이 확인되지 않았습니다.</h2></div>
              <div class="fi-no-change-message">
                <p>분석 결과를 승인한 뒤 결과 확인 화면에서 대상 화면을 추가하여 작업 범위를 보완할 수 있습니다.</p>
              </div>
              <section class="fi-approval" aria-labelledby="approval-title">
                <h3 class="sr-only" id="approval-title">분석 결과 처리</h3>
                <div class="fi-decision-actions"><button class="button button--primary js-apply-analysis" type="button">분석 결과 승인</button><button class="button js-continue-chat" type="button">더 대화하기</button></div>
              </section>
            </div>
          </article>
          <article class="fi-message fi-general-response">
            <div class="fi-message__bubble">
              <header><h2>추가 질문에 답변드립니다.</h2></header>
              <div class="fi-general-response__body">
                <p>결제 가능 상품권 안내 문구는 가맹점 찾기 화면과 연결된 데이터에서 제공됩니다. 문구만 변경한다면 현재 화면 구조를 유지하면서 안내 내용만 수정할 수 있습니다.</p>
              </div>
            </div>
          </article>
        </div>

        <form class="fi-composer" id="chat-form" action="#">
          <label for="chat-message"><span class="sr-only">메시지 입력</span><textarea id="chat-message" placeholder="분석 결과에서 궁금한 내용이나 추가 조건을 입력하세요"></textarea></label>
          <button class="button button--primary" type="submit">전송</button>
        </form>
      </section>
    </div>
  </main>
</template>
<script src="_shell.js"></script>
<script>
  틀({제목:'FRD 요구사항 분석 결과 검토',모양:'산출물',지금:'frds',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});
  const chatInput=document.getElementById('chat-message');
  const sessionState=document.getElementById('session-state');
  const interviewLog=document.getElementById('interview-log');
  const analysisResult=document.getElementById('analysis-result');
  requestAnimationFrame(()=>{interviewLog.scrollTop=analysisResult.offsetTop-interviewLog.offsetTop-16;});
  document.querySelectorAll('.js-continue-chat').forEach(button=>button.addEventListener('click',()=>chatInput.focus()));
  document.querySelectorAll('.js-apply-analysis').forEach(button=>button.addEventListener('click',event=>{event.currentTarget.textContent='승인 완료';event.currentTarget.disabled=true;event.currentTarget.nextElementSibling.hidden=true;sessionState.classList.remove('is-waiting');sessionState.querySelector('span').textContent='분석 결과 승인 완료';}));
  document.getElementById('chat-form').addEventListener('submit',event=>{event.preventDefault();if(!chatInput.value.trim())return;sessionState.classList.remove('is-waiting');sessionState.querySelector('span').textContent='추가 내용 분석 중';chatInput.value='';});
</script>
</body>
</html>
