<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css"><link rel="stylesheet" href="../../src/main/resources/static/css/reset.css"><link rel="stylesheet" href="../../src/main/resources/static/css/typography.css"><link rel="stylesheet" href="../../src/main/resources/static/css/components.css"><link rel="stylesheet" href="../../src/main/resources/static/css/shell.css"><link rel="stylesheet" href="_mock.css"><link rel="stylesheet" href="../../src/main/resources/static/css/screens.css"><link rel="stylesheet" href="_frd-interview-candidates.css">
  <title>AI 인터뷰 시안 B</title>
</head>
<body>
<template id="본문">
  <main class="fic-page">
    <header class="fic-head"><div class="fic-head__copy"><span class="fic-kicker">FRD 작업 만들기 · 시안 B</span><h1>근거를 비교하고 범위를 선택해 주세요</h1><p>요구사항과 현재 운영 화면에서 확인한 내용을 함께 보여드립니다.</p></div><span class="fic-status">답변 필요</span></header>
    <nav class="fic-steps" aria-label="FRD 작업 만들기 진행 단계"><div class="fic-step is-done"><i>✓</i><span>요구사항 입력</span></div><div class="fic-step is-current" aria-current="step"><i>2</i><span>AI 인터뷰</span></div><div class="fic-step"><i>3</i><span>개발 범위 확인</span></div></nav>
    <div class="fic-evidence-layout">
      <div class="fic-evidence-main">
        <section class="fic-card" aria-labelledby="evidence-title">
          <header class="fic-card__head"><div><h2 id="evidence-title">확인 1. 안내 문구의 변경 범위</h2><p>현재 확인된 근거를 비교한 뒤 하나를 선택해 주세요.</p></div><span class="fic-round"><strong>1</strong> / 2 질문</span></header>
          <div class="fic-card__body">
            <div class="fic-evidence-grid">
              <section class="fic-evidence-panel" aria-labelledby="request-evidence-title"><span>요구사항에서 확인</span><h3 id="request-evidence-title">가맹점 찾기 안내 정리</h3><p>지원금 종료에 맞춰 가맹점 찾기에서 더 이상 유효하지 않은 안내를 정리해야 합니다.</p></section>
              <section class="fic-evidence-panel" aria-labelledby="screen-evidence-title"><span>현재 운영 화면에서 확인</span><h3 id="screen-evidence-title">같은 정보가 2개 화면에 표시됨</h3><p>진입 화면의 안내 문구와 상세조회 필터가 같은 상품권 정보를 사용합니다.</p><div class="fic-screen-ref"><i aria-hidden="true"></i><div><strong>가맹점 찾기 · 상세조회 필터</strong><small class="num">wv-merc-search-main · wv-modal-merc-filter</small></div></div></section>
            </div>
            <div class="fic-difference"><i>!</i><div><strong>판단이 필요한 차이</strong><p>요구사항에는 “안내 정리”라고만 적혀 있어 상세조회 필터까지 바꿀지 확정할 수 없습니다.</p></div></div>
            <fieldset class="fic-options"><legend class="fic-question-title">어느 범위까지 변경할까요?</legend>
              <label class="fic-option"><input type="radio" name="evidence-scope" value="한 화면"><span>가맹점 찾기 첫 화면만 변경<small>안내 문구만 종료 상태에 맞춥니다.</small></span></label>
              <label class="fic-option"><input type="radio" name="evidence-scope" value="두 화면" checked><span>첫 화면과 상세조회 필터 모두 변경<small>안내 문구와 필터 항목을 함께 정리합니다.</small></span></label>
              <label class="fic-option"><input type="radio" name="evidence-scope" value="보류"><span>개발 범위 확인에서 다시 결정<small>권장안을 남기고 현재 질문은 확인 필요로 처리합니다.</small></span></label>
            </fieldset>
          </div>
          <footer class="fic-actions"><p>선택에 따라 오른쪽 예상 범위가 바뀝니다.</p><div class="fic-actions__buttons"><button class="button" type="button">요구사항 입력으로</button><button class="button button--primary" id="evidence-submit" type="button">선택 내용 반영</button></div></footer>
        </section>
      </div>
      <aside class="fic-card fic-scope-preview" aria-labelledby="scope-preview-title"><header class="fic-card__head"><div><h2 id="scope-preview-title">예상 개발 범위</h2><p>현재 선택을 반영한 미리보기입니다.</p></div></header><div class="fic-card__body"><ul id="scope-list"><li><span>화면</span><strong>2개 화면</strong><small>가맹점 찾기, 상세조회 필터</small></li><li><span>데이터</span><strong>상품권 안내 데이터</strong><small>문구와 필터 항목을 종료 상태로 변경</small></li><li><span>남은 확인</span><strong>1개</strong><small>공지사항 게시 일정을 다음 질문에서 확인</small></li></ul></div></aside>
    </div>
  </main>
</template>
<script src="_shell.js"></script>
<script>
  틀({제목:'AI 인터뷰',모양:'산출물',지금:'frds',프로젝트이름:'G2C',프로젝트번호:1,프로젝트들:['G2C','서울페이'],사람:'이영희',안읽은알림:2});
  const scopeList=document.getElementById('scope-list');
  document.querySelectorAll('input[name="evidence-scope"]').forEach(choice=>choice.addEventListener('change',()=>{scopeList.firstElementChild.querySelector('strong').textContent=choice.value==='두 화면'?'2개 화면':choice.value==='한 화면'?'1개 화면':'확인 필요';scopeList.firstElementChild.querySelector('small').textContent=choice.value==='두 화면'?'가맹점 찾기, 상세조회 필터':choice.value==='한 화면'?'가맹점 찾기':'개발 범위 확인에서 결정';}));
  document.getElementById('evidence-submit').addEventListener('click',event=>{event.currentTarget.textContent='선택 반영 완료';event.currentTarget.disabled=true;});
</script>
</body>
</html>
