<template id="본문">
  <section class="stack" aria-labelledby="error-title">
    <h1 id="error-title">화면을 찾지 못했습니다</h1>

      <p>프로젝트 목록에서 다시 찾아 주세요.</p>
    </section>

    <p class="error-code num">상태 코드 404</p>

    <a class="button button--primary" href="11c-project-select.html">프로젝트 목록으로 이동</a>
  </section>
</template>
