<!--
  FRD 작업 완료를 누른 뒤 개발요청서를 준비하는 한 시점 (2026-09-24 사용자 확정 — 완료는 준비까지 기다린다).
  - AI 가 변경 예정 기능정의서와 테스트 시나리오를 만든다. 기획자는 이 FRD 화면에서 기다린다.
  - 끝나면 개발요청서 상세로 넘어간다. 준비 중인 개발요청서는 목록에 보이지 않는다.
  - 하나라도 못 만들면 개발요청서를 거두고 FRD 를 완료 전으로 되돌린다(05t).
  - 화면을 닫아도 준비는 계속된다. 다시 열면 이어서 보여 준다.
-->
<template id="본문">
  <div class="artifact-generation-layout">
    <header class="rq-head">
      <div class="rq-head__copy"><span class="rq-kicker num">FRD-009</span><h1>에이블리 회원가입 성별 선택 추가</h1><p>FRD 작업을 완료했습니다. 개발요청서를 준비하고 있습니다.</p></div>
    </header>
    <section class="artifact-generation" aria-live="polite">
      <p class="artifact-generation__label"><span class="artifact-generation__dot" aria-hidden="true"></span>개발요청서 준비 중</p>
      <h2>변경 예정 기능정의서와 테스트 시나리오를 만들고 있습니다</h2>
      <p class="artifact-generation__description">AI가 바뀐 화면의 기능정의서와 완료 조건마다 테스트 시나리오를 씁니다. 몇 분 걸립니다.</p>
      <div class="artifact-generation__track" aria-hidden="true"></div>
      <p class="artifact-generation__note">끝나면 개발요청서로 넘어갑니다. 이 화면을 닫아도 준비는 계속됩니다.</p>
    </section>
  </div>
