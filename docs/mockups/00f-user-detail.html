<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../src/main/resources/static/css/tokens.css"><link rel="stylesheet" href="../../src/main/resources/static/css/reset.css"><link rel="stylesheet" href="../../src/main/resources/static/css/typography.css"><link rel="stylesheet" href="../../src/main/resources/static/css/components.css"><link rel="stylesheet" href="../../src/main/resources/static/css/shell.css"><link rel="stylesheet" href="_mock.css"><link rel="stylesheet" href="../../src/main/resources/static/css/screens.css">
  <title>사용자 상세</title>
</head>
<body><template id="본문">
  <div class="requirement-concept account-detail-page">
    <header class="rq-head">
      <div class="rq-head__copy"><span class="rq-kicker">사용자 계정</span><h1>이영희</h1><p>로그인 정보와 Builder 사용 준비 상태를 확인합니다.</p></div>
      <div class="rq-head__actions"><span class="status-badge status-badge--complete">설정 완료</span><a class="button" href="00b-user-management.html">사용자 목록</a><button class="button button--danger-outline" type="button" data-open-account-password-dialog data-submit-loading="임시 비밀번호 재발급 중" data-submit-loading-tone="dark">임시 비밀번호 재발급</button></div>
    </header>

    <main class="account-detail-sections">
      <section class="rq-card" aria-labelledby="user-information-title">
        <div class="rq-card__head"><div><span class="rq-kicker">사용자 정보</span><h2 id="user-information-title">계정 및 연결 상태</h2><p>로그인과 작업 기록에 사용하는 정보입니다.</p></div></div>
        <div class="rq-card__body"><dl class="project-info-list"><div><dt>이름</dt><dd>이영희</dd></div><div><dt>로그인 아이디</dt><dd class="num">younghee</dd></div><div><dt>이메일</dt><dd>lee@bizplay.co.kr</dd></div><div><dt>권한</dt><dd>기획자</dd></div><div><dt>최초 설정</dt><dd><span class="status-badge status-badge--complete">설정 완료</span></dd></div><div class="account-detail-claude-field"><dt>Claude 계정</dt><dd><span class="status-badge status-badge--complete">연결 완료</span></dd></div></dl></div>
      </section>
    </main>
  </div>
  <dialog class="dialog dialog--layer account-password-dialog" id="account-password-dialog" aria-labelledby="account-password-dialog-title">
    <form method="dialog">
      <header class="dialog__header"><div class="dialog__header-copy"><h2 class="dialog__title" id="account-password-dialog-title">임시 비밀번호가 재발급되었습니다.</h2><p class="dialog__description">지금 사용자에게 직접 전달해 주세요. 이 화면을 닫으면 다시 볼 수 없습니다.</p></div><button class="dialog__close" type="submit" aria-label="임시 비밀번호 안내 닫기"></button></header>
      <div class="dialog__body account-password-dialog__body"><div class="account-password-dialog__value" role="status"><code class="num">FU3cNYV6pXEF</code></div></div>
      <div class="dialog__actions"><button class="button button--primary" id="account-password-dialog-confirm" type="submit">확인</button></div>
    </form>
  </dialog>
</template><script src="_shell.js"></script><script>틀({제목:'사용자 상세',모양:'관리',지금:'accounts',사람:'슈퍼관리자',슈퍼계정:true,안읽은알림:0});</script><script>
  const accountPasswordDialog = document.getElementById('account-password-dialog');
  document.querySelector('[data-open-account-password-dialog]')?.addEventListener('click', () => {
    accountPasswordDialog?.showModal();
    document.getElementById('account-password-dialog-confirm')?.focus();
  });
</script></body>
</html>
